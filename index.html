<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pickleball Live Court Scoreboard</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .pickleball-app-wrapper {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-main: #ffffff;
      --text-dim: #aaaaaa;
      --court-gray: #3a3a3a;
      --kitchen-blue: #0d47a1;
      --accent-gold: #ffb300;
      --btn-gray: #424242;
      --team-a-score: #2e7d32;
      --team-b-score: #ff1493;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    .pickleball-app-wrapper * {
      box-sizing: border-box;
    }
    .pickleball-app-wrapper .container {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .pickleball-app-wrapper .sync-bar {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: #1b1b1b;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 8px 12px;
      margin-bottom: 10px;
      font-size: 0.8rem;
      position: relative;
    }
    .pickleball-app-wrapper .sync-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .pickleball-app-wrapper .sync-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #ffb300;
      display: inline-block;
    }
    .pickleball-app-wrapper .sync-dot.live {
      background: #4caf50;
    }
    .pickleball-app-wrapper .sync-status {
      color: var(--text-dim);
      font-size: 0.75rem;
    }
    .pickleball-app-wrapper .sync-actions {
      display: flex;
      gap: 6px;
    }
    .pickleball-app-wrapper .btn-mini {
      background: #333;
      color: #fff;
      border: 1px solid #555;
      border-radius: 6px;
      padding: 5px 9px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
    }
    .pickleball-app-wrapper .qr-popover {
      position: absolute;
      top: 46px;
      right: 10px;
      background: #ffffff;
      color: #111111;
      padding: 12px;
      border-radius: 10px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.7);
      z-index: 100;
      text-align: center;
      min-width: 184px;
    }
    .pickleball-app-wrapper .qr-title {
      font-size: 0.75rem;
      font-weight: 800;
      margin-bottom: 8px;
      text-transform: uppercase;
    }
    .pickleball-app-wrapper #qr-code-box {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 160px;
    }
    .pickleball-app-wrapper .qr-url-label {
      margin-top: 8px;
      font-size: 0.65rem;
      max-width: 170px;
      word-break: break-all;
      color: #444;
    }
    .pickleball-app-wrapper .hud {
      background-color: var(--card-bg);
      border-radius: 10px;
      border: 1px solid #333;
      padding: 16px 12px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }
    .pickleball-app-wrapper .server-banner {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .pickleball-app-wrapper .banner-pill {
      background: var(--accent-gold);
      color: #000;
      font-weight: 900;
      font-size: 0.85rem;
      padding: 4px 12px;
      border-radius: 999px;
      letter-spacing: 0.5px;
    }
    .pickleball-app-wrapper .banner-detail {
      background: #2b2b2b;
      border: 1px solid #444;
      color: #fff;
      font-weight: 700;
      font-size: 0.8rem;
      padding: 4px 10px;
      border-radius: 6px;
    }
    .pickleball-app-wrapper .status-text {
      font-size: 1.0rem;
      color: var(--text-dim);
      font-weight: bold;
      text-transform: uppercase;
    }
    .pickleball-app-wrapper .score-callout {
      font-size: 4rem;
      font-weight: 900;
      margin: 6px 0;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
    }
    .pickleball-app-wrapper .score-left,
    .pickleball-app-wrapper .score-right {
      font-size: 4rem;
      font-weight: 900;
    }
    .pickleball-app-wrapper .score-divider {
      color: #555;
      font-size: 2.5rem;
    }
    .pickleball-app-wrapper .court {
      background-color: var(--court-gray);
      border: 4px solid white;
      border-radius: 8px;
      display: flex;
      flex-direction: row;
      aspect-ratio: 20 / 11;
      position: relative;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.4);
    }
    .pickleball-app-wrapper .court-half {
      width: 50%;
      display: flex;
      flex-direction: row;
      position: relative;
    }
    .pickleball-app-wrapper .left-half {
      flex-direction: row-reverse;
    }
    .pickleball-app-wrapper .right-half {
      flex-direction: row;
    }
    .pickleball-app-wrapper .baseline-label {
      position: absolute;
      top: 6px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 1.0rem;
      font-weight: 900;
      color: #ffeb3b;
      text-shadow: 0 0 6px rgba(0, 0, 0, 0.8);
      background: rgba(0, 0, 0, 0.6);
      padding: 4px 12px;
      border-radius: 14px;
      letter-spacing: 1px;
      z-index: 15;
      white-space: nowrap;
    }
    .pickleball-app-wrapper .kitchen {
      width: 18%;
      background-color: var(--kitchen-blue);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.7rem;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.8);
      writing-mode: vertical-lr;
      transform: rotate(180deg);
    }
    .pickleball-app-wrapper .left-half .kitchen {
      border-left: 3px solid white;
    }
    .pickleball-app-wrapper .right-half .kitchen {
      border-right: 3px solid white;
    }
    .pickleball-app-wrapper .baselines {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .pickleball-app-wrapper .quadrant {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      border-bottom: 2px dashed rgba(255, 255, 255, 0.5);
    }
    .pickleball-app-wrapper .quadrant:last-child {
      border-bottom: none;
    }
    .pickleball-app-wrapper .net {
      width: 6px;
      background-color: #111;
      height: 100%;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
    }
    .pickleball-app-wrapper .player-node {
      position: relative;
      background: rgba(0, 0, 0, 0.8);
      padding: 6px 10px;
      border-radius: 20px;
      border: 2px solid transparent;
      text-align: center;
      width: 80%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .pickleball-app-wrapper .player-input {
      background: transparent;
      border: none;
      border-bottom: 1px solid #777;
      color: #fff;
      width: 80%;
      text-align: center;
      text-transform: uppercase;
      font-size: 0.9rem;
    }
    .pickleball-app-wrapper .player-input:focus {
      outline: none;
      border-bottom-color: var(--accent-gold);
    }
    .pickleball-app-wrapper .left-half .player-node {
      border-color: rgba(76, 175, 80, 0.4);
    }
    .pickleball-app-wrapper .right-half .player-node {
      border-color: rgba(255, 20, 147, 0.3);
    }
    .pickleball-app-wrapper .player-node.serving {
      border-color: var(--accent-gold) !important;
      box-shadow: 0 0 12px var(--accent-gold);
    }
    .pickleball-app-wrapper .player-node.serving::before {
      content: "SERVING";
      position: absolute;
      top: -10px;
      background: var(--accent-gold);
      color: #000;
      font-size: 0.6rem;
      font-weight: 900;
      padding: 1px 6px;
      border-radius: 4px;
      letter-spacing: 0.5px;
    }
    .pickleball-app-wrapper .server-indicator {
      color: var(--accent-gold);
      font-size: 0.65rem;
      font-weight: 700;
      display: block;
      margin-top: 2px;
      text-transform: uppercase;
    }
    .pickleball-app-wrapper .controls {
      margin-top: 10px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .pickleball-app-wrapper .btn {
      padding: 16px;
      font-size: 1.05rem;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      color: white;
      transition: background 0.2s;
    }
    .pickleball-app-wrapper .btn:active {
      opacity: 0.8;
    }
    .pickleball-app-wrapper .btn-teamA {
      background-color: #2e7d32;
    }
    .pickleball-app-wrapper .btn-teamB {
      background-color: var(--team-b-score);
    }
    .pickleball-app-wrapper .btn-utility {
      background-color: var(--btn-gray);
      grid-column: span 2;
      padding: 12px;
      font-size: 0.95rem;
    }
    .pickleball-app-wrapper .fault-controls {
      margin-top: 8px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .pickleball-app-wrapper .btn-fault {
      padding: 10px;
      font-size: 0.85rem;
      color: white;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .pickleball-app-wrapper .btn-fault:active {
      opacity: 0.8;
    }
    .pickleball-app-wrapper #btn-fault-serve {
      background-color: var(--accent-gold);
      color: #000000;
    }
    .pickleball-app-wrapper .fault-log,
    .pickleball-app-wrapper .score-log {
      margin-top: 8px;
      font-size: 0.8rem;
      color: var(--text-dim);
      max-height: 90px;
      overflow-y: auto;
      text-align: left;
      padding: 6px 8px;
      border-radius: 6px;
      background: #1b1b1b;
      border: 1px solid #333;
    }
    .pickleball-app-wrapper .fault-log-entry,
    .pickleball-app-wrapper .score-log-entry {
      margin-bottom: 2px;
    }
    .pickleball-app-wrapper .game-log-details {
      margin-top: 4px;
      padding-left: 8px;
      font-size: 0.75rem;
      color: #bbb;
      border-left: 2px solid #444;
    }
    .pickleball-app-wrapper .game-log-section-title {
      font-weight: 700;
      color: #9e9e9e;
      margin-top: 4px;
      margin-bottom: 2px;
    }
    .pickleball-app-wrapper .game-target-row {
      width: 100%;
      margin-top: 6px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      color: var(--text-dim);
    }
    .pickleball-app-wrapper .rules-badge {
      background: #333;
      padding: 2px 8px;
      border-radius: 4px;
      color: #fff;
      font-size: 0.8rem;
    }

    /* Display Mode */
    .pickleball-app-wrapper.display-mode {
      justify-content: center;
      padding: 24px;
    }
    .pickleball-app-wrapper.display-mode .container {
      max-width: 820px;
      gap: 14px;
    }
    .pickleball-app-wrapper.display-mode .banner-detail {
      display: none !important;
    }
    .pickleball-app-wrapper.display-mode .controls,
    .pickleball-app-wrapper.display-mode .fault-controls,
    .pickleball-app-wrapper.display-mode .fault-log,
    .pickleball-app-wrapper.display-mode .score-log,
    .pickleball-app-wrapper.display-mode .handicap-controls,
    .pickleball-app-wrapper.display-mode .match-summary-log-container,
    .pickleball-app-wrapper.display-mode #initial-server-hud-row,
    .pickleball-app-wrapper.display-mode .game-target-row {
      display: none !important;
    }
    .pickleball-app-wrapper.display-mode .court {
      display: flex !important;
    }
    .pickleball-app-wrapper.display-mode .sync-bar,
    .pickleball-app-wrapper.display-mode #sync-bar {
      display: flex !important;
      max-width: 820px;
      margin-bottom: 0;
    }
    .pickleball-app-wrapper.display-mode .sync-actions {
      display: none;
    }
    .pickleball-app-wrapper.display-mode .event-header {
      padding: 12px 18px !important;
      margin-bottom: 0 !important;
    }
    .pickleball-app-wrapper.display-mode #select-active-match {
      pointer-events: none;
      appearance: none;
      -webkit-appearance: none;
      background: transparent !important;
      border: none !important;
      font-size: 1.05rem !important;
      font-weight: 800 !important;
      padding: 0 !important;
    }
    .pickleball-app-wrapper.display-mode .event-header input {
      pointer-events: none;
      font-size: 1.05rem !important;
      width: auto !important;
      max-width: 110px;
    }
    .pickleball-app-wrapper.display-mode #event-score-A,
    .pickleball-app-wrapper.display-mode #event-score-B {
      font-size: 1.35rem !important;
    }
    .pickleball-app-wrapper.display-mode .score-hud {
      padding: 28px 20px;
    }
    .pickleball-app-wrapper.display-mode .banner-pill {
      font-size: 1.1rem;
      padding: 6px 18px;
    }
    .pickleball-app-wrapper.display-mode .status-text {
      font-size: 1.2rem;
      margin-top: 6px;
    }
    .pickleball-app-wrapper.display-mode .score-callout,
    .pickleball-app-wrapper.display-mode .score-left,
    .pickleball-app-wrapper.display-mode .score-right {
      font-size: 6rem;
    }
    .pickleball-app-wrapper.display-mode .score-divider {
      font-size: 4rem;
    }
    .pickleball-app-wrapper.display-mode .player-input {
      pointer-events: none;
      border-bottom: none;
      font-size: 1.1rem;
      font-weight: 700;
    }
    .pickleball-app-wrapper.display-mode .server-indicator {
      font-size: 0.8rem;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <div class="pickleball-app-wrapper">
    <div id="sync-bar" class="sync-bar">
      <div class="sync-left">
        <span id="sync-dot" class="sync-dot"></span>
        <span>Room: <strong id="room-code-text">----</strong></span>
        <span id="sync-status-label" class="sync-status">Local</span>
      </div>
      <div class="sync-actions">
        <button type="button" id="btn-toggle-qr" class="btn-mini">QR Link</button>
        <button type="button" id="btn-switch-view" class="btn-mini">Display Mode</button>
        <button type="button" id="btn-fullscreen" class="btn-mini">Full Screen</button>
      </div>
      <div id="qr-popover" class="qr-popover" style="display: none;">
        <div class="qr-title">Scan for Big-Screen Display</div>
        <div id="qr-code-box"></div>
        <div id="qr-url-label" class="qr-url-label"></div>
      </div>
    </div>

    <div class="container">
      <!-- Compact Team Event Header & Overall Match Scoreboard -->
      <div class="hud event-header" style="background: #252525; border: 1px solid var(--accent-gold); margin-bottom: 8px; padding: 6px 12px;">
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px;">
          <div style="display: flex; align-items: center; gap: 8px;">
            <span style="font-size: 0.75rem; color: var(--accent-gold); font-weight: bold; text
