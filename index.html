<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pickleball Live Court Scoreboard</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .pickleball-app-wrapper {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-main: #ffffff;
      --text-dim: #aaaaaa;
      --court-gray: #3a3a3a;
      --kitchen-blue: #0d47a1;
      --accent-gold: #ffb300;
      --btn-gray: #424242;
      --team-a-score: #2e7d32;
      --team-b-score: #ff1493;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    .pickleball-app-wrapper * { box-sizing: border-box; }
    .pickleball-app-wrapper .container { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 12px; }

    /* Sync & QR Bar */
    .pickleball-app-wrapper .sync-bar {
      width: 100%; max-width: 600px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 8px; background: #1b1b1b; border: 1px solid #333; border-radius: 8px; padding: 8px 12px; margin-bottom: 10px;
      font-size: 0.8rem; position: relative;
    }
    .pickleball-app-wrapper .sync-left { display: flex; align-items: center; gap: 8px; }
    .pickleball-app-wrapper .sync-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent-gold); display: inline-block; }
    .pickleball-app-wrapper .sync-dot.live { background: #4caf50; }
    .pickleball-app-wrapper .sync-status { color: var(--text-dim); font-size: 0.75rem; }
    .pickleball-app-wrapper .sync-actions { display: flex; gap: 6px; }
    .pickleball-app-wrapper .btn-mini {
      background: #333; color: #fff; border: 1px solid #555; border-radius: 6px;
      padding: 5px 9px; font-size: 0.75rem; font-weight: 700; cursor: pointer;
    }
    .pickleball-app-wrapper .qr-popover {
      position: absolute; top: 46px; right: 10px; background: #fff; color: #111; padding: 12px;
      border-radius: 10px; box-shadow: 0 12px 28px rgba(0,0,0,0.7); z-index: 100; text-align: center; min-width: 184px;
    }
    .pickleball-app-wrapper .qr-title { font-size: 0.75rem; font-weight: 800; margin-bottom: 8px; text-transform: uppercase; }
    .pickleball-app-wrapper #qr-code-box { display: flex; justify-content: center; align-items: center; min-height: 160px; }
    .pickleball-app-wrapper .qr-url-label { margin-top: 8px; font-size: 0.65rem; max-width: 170px; word-break: break-all; color: #444; }

    /* HUD & Score */
    .pickleball-app-wrapper .hud {
      background-color: var(--card-bg); border-radius: 10px; border: 1px solid #333;
      padding: 16px 12px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .pickleball-app-wrapper .server-banner { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px; margin-bottom: 8px; }
    .pickleball-app-wrapper .banner-pill {
      background: var(--accent-gold); color: #000; font-weight: 900; font-size: 0.85rem;
      padding: 4px 12px; border-radius: 999px; letter-spacing: 0.5px;
    }
    .pickleball-app-wrapper .banner-detail {
      background: #2b2b2b; border: 1px solid #444; color: #fff; font-weight: 700;
      font-size: 0.8rem; padding: 4px 10px; border-radius: 6px;
    }
    .pickleball-app-wrapper .status-text { font-size: 1rem; color: var(--text-dim); font-weight: bold; text-transform: uppercase; }
    .pickleball-app-wrapper .score-callout {
      font-size: 4rem; font-weight: 900; margin: 6px 0; display: flex;
      justify-content: center; align-items: center; flex-wrap: wrap; gap: 14px;
    }
    .pickleball-app-wrapper .score-left, .pickleball-app-wrapper .score-right { font-size: 4rem; font-weight: 900; }
    .pickleball-app-wrapper .score-divider { color: #555; font-size: 2.5rem; }
    .pickleball-app-wrapper .game-target-row {
      width: 100%; margin-top: 8px; display: flex; justify-content: center; align-items: center;
      gap: 6px; font-size: 0.85rem; color: var(--text-dim);
    }

    /* Court Diagram */
    .pickleball-app-wrapper .court {
      background-color: var(--court-gray); border: 4px solid white; border-radius: 8px;
      display: flex; flex-direction: row; aspect-ratio: 20 / 11; position: relative;
      box-shadow: 0 6px 15px rgba(0,0,0,0.4);
    }
    .pickleball-app-wrapper .court-half { width: 50%; display: flex; flex-direction: row; position: relative; }
    .pickleball-app-wrapper .left-half { flex-direction: row-reverse; }
    .pickleball-app-wrapper .right-half { flex-direction: row; }
    .pickleball-app-wrapper .baseline-label {
      position: absolute; top: 6px; left: 50%; transform: translateX(-50%); font-size: 1rem; font-weight: 900;
      color: #ffeb3b; text-shadow: 0 0 6px rgba(0,0,0,0.8); background: rgba(0,0,0,0.6);
      padding: 4px 12px; border-radius: 14px; letter-spacing: 1px; z-index: 15; white-space: nowrap;
    }
    .pickleball-app-wrapper .kitchen {
      width: 18%; background-color: var(--kitchen-blue); display: flex; align-items: center; justify-content: center;
      font-weight: bold; font-size: 0.7rem; text-transform: uppercase; color: rgba(255,255,255,0.8);
      writing-mode: vertical-lr; transform: rotate(180deg);
    }
    .pickleball-app-wrapper .left-half .kitchen { border-left: 3px solid white; }
    .pickleball-app-wrapper .right-half .kitchen { border-right: 3px solid white; }
    .pickleball-app-wrapper .baselines { flex: 1; display: flex; flex-direction: column; }
    .pickleball-app-wrapper .quadrant {
      flex: 1; display: flex; align-items: center; justify-content: center; position: relative;
      border-bottom: 2px dashed rgba(255,255,255,0.5);
    }
    .pickleball-app-wrapper .quadrant:last-child { border-bottom: none; }
    .pickleball-app-wrapper .net { width: 6px; background-color: #111; height: 100%; position: absolute; left: 50%; transform: translateX(-50%); z-index: 10; }
    .pickleball-app-wrapper .player-node {
      position: relative; background: rgba(0,0,0,0.8); padding: 6px 10px; border-radius: 20px;
      border: 2px solid transparent; text-align: center; width: 80%; display: flex; flex-direction: column; align-items: center;
    }
    .pickleball-app-wrapper .player-input {
      background: transparent; border: none; border-bottom: 1px solid #777; color: #fff;
      width: 80%; text-align: center; text-transform: uppercase; font-size: 0.9rem;
    }
    .pickleball-app-wrapper .player-input:focus { outline: none; border-bottom-color: var(--accent-gold); }
    .pickleball-app-wrapper .left-half .player-node { border-color: rgba(76,175,80,0.4); }
    .pickleball-app-wrapper .right-half .player-node { border-color: rgba(255,20,147,0.3); }
    .pickleball-app-wrapper .player-node.serving { border-color: var(--accent-gold) !important; box-shadow: 0 0 12px var(--accent-gold); }
    .pickleball-app-wrapper .player-node.serving::before {
      content: "SERVING"; position: absolute; top: -10px; background: var(--accent-gold); color: #000;
      font-size: 0.6rem; font-weight: 900; padding: 1px 6px; border-radius: 4px; letter-spacing: 0.5px;
    }
    .pickleball-app-wrapper .server-indicator { color: var(--accent-gold); font-size: 0.65rem; font-weight: 700; display: block; margin-top: 2px; text-transform: uppercase; }

    /* Controller Controls */
    .pickleball-app-wrapper .controls { margin-top: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .pickleball-app-wrapper .btn { padding: 16px; font-size: 1.05rem; font-weight: bold; border: none; border-radius: 10px; cursor: pointer; color: white; }
    .pickleball-app-wrapper .btn:active { opacity: 0.8; }
    .pickleball-app-wrapper .btn-teamA { background-color: var(--team-a-score); }
    .pickleball-app-wrapper .btn-teamB { background-color: var(--team-b-score); }
    .pickleball-app-wrapper .btn-utility { background-color: var(--btn-gray); grid-column: span 2; padding: 12px; font-size: 0.95rem; }
    .pickleball-app-wrapper .fault-controls { margin-top: 8px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .pickleball-app-wrapper .btn-fault { padding: 10px; font-size: 0.85rem; color: white; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; }
    .pickleball-app-wrapper #btn-fault-serve { background-color: var(--accent-gold); color: #000; }
    .pickleball-app-wrapper .fault-log {
      margin-top: 8px; font-size: 0.8rem; color: var(--text-dim); max-height: 80px; overflow-y: auto;
      text-align: left; padding: 6px 8px; border-radius: 6px; background: #1b1b1b; border: 1px solid #333;
    }

    /* TV Display Mode: Only Room Indicator + Big Score + Game Rule + Court Diagram & Server Indicator */
    .pickleball-app-wrapper.display-mode { justify-content: center; padding: 24px; }
    .pickleball-app-wrapper.display-mode .container { max-width: 840px; gap: 16px; }
    .pickleball-app-wrapper.display-mode .event-header,
    .pickleball-app-wrapper.display-mode .controls,
    .pickleball-app-wrapper.display-mode .fault-controls,
    .pickleball-app-wrapper.display-mode .fault-log,
    .pickleball-app-wrapper.display-mode .handicap-controls,
    .pickleball-app-wrapper.display-mode .match-summary-log-container,
    .pickleball-app-wrapper.display-mode #initial-server-hud-row,
    .pickleball-app-wrapper.display-mode .sync-actions,
    .pickleball-app-wrapper.display-mode .banner-detail { display: none !important; }
    .pickleball-app-wrapper.display-mode .sync-bar { max-width: 840px; margin-bottom: 0; padding: 10px 16px; font-size: 0.95rem; }
    .pickleball-app-wrapper.display-mode #room-code-text { color: var(--accent-gold); font-size: 1.05rem; letter-spacing: 1px; }
    .pickleball-app-wrapper.display-mode .score-hud { padding: 26px 20px; }
    .pickleball-app-wrapper.display-mode .score-callout,
    .pickleball-app-wrapper.display-mode .score-left,
    .pickleball-app-wrapper.display-mode .score-right { font-size: 5.75rem; }
    .pickleball-app-wrapper.display-mode .score-divider { font-size: 3.75rem; }
    .pickleball-app-wrapper.display-mode .game-target-row { display: flex !important; font-size: 1rem; margin-top: 10px; }
    .pickleball-app-wrapper.display-mode #select-game-rules { pointer-events: none; appearance: none; -webkit-appearance: none; font-size: 0.95rem; font-weight: 700; }
    .pickleball-app-wrapper.display-mode .court { display: flex !important; }
    .pickleball-app-wrapper.display-mode .player-input { pointer-events: none; border-bottom-color: transparent; font-size: 1.15rem; font-weight: 800; }
    .pickleball-app-wrapper.display-mode .server-indicator { font-size: 0.8rem; font-weight: 800; }
  </style>
</head>
<body>
  <div class="pickleball-app-wrapper">
    <div id="sync-bar" class="sync-bar">
      <div class="sync-left">
        <span id="sync-dot" class="sync-dot"></span>
        <span>Room: <strong id="room-code-text">----</strong></span>
        <span id="sync-status-label" class="sync-status">Local</span>
      </div>
      <div class="sync-actions">
        <button type="button" id="btn-toggle-qr" class="btn-mini">QR Link</button>
        <button type="button" id="btn-switch-view" class="btn-mini">Display Mode</button>
        <button type="button" id="btn-fullscreen" class="btn-mini">Full Screen</button>
      </div>
      <div id="qr-popover" class="qr-popover" style="display: none;">
        <div class="qr-title">Scan for Display TV</div>
        <div id="qr-code-box"></div>
        <div id="qr-url-label" class="qr-url-label"></div>
      </div>
    </div>

    <div class="container">
      <div class="hud event-header" style="background: #252525; border: 1px solid var(--accent-gold); margin-bottom: 8px; padding: 6px 12px;">
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px;">
          <div style="display: flex; align-items: center; gap: 8px;">
            <span style="font-size: 0.75rem; color: var(--accent-gold); font-weight: bold; text-transform: uppercase;">Event:</span>
            <select id="select-active-match" style="background: #333; color: #fff; border: 1px solid #555; padding: 2px 6px; border-radius: 4px; font-size: 0.8rem;">
              <option value="0">Game 1: 男雙 VS 女雙</option>
              <option value="1">Game 2: 男雙 VS 混雙</option>
              <option value="2">Game 3: 混雙 VS 女雙</option>
              <option value="3">Game 4: 同屬性對戰</option>
            </select>
          </div>
          <div style="display: flex; align-items: center; gap: 6px; font-size: 0.85rem;">
            <input id="team-name-A" value="Team A" style="background:transparent; border:none; color:var(--team-a-score); font-weight:bold; text-align:right; width:70px;">
            <span id="event-score-A" style="font-size: 1.1rem; font-weight: 900; color: var(--team-a-score);">0</span>
            <span style="color: #777; font-weight: bold;">:</span>
            <span id="event-score-B" style="font-size: 1.1rem; font-weight: 900; color: var(--team-b-score);">0</span>
            <input id="team-name-B" value="Team B" style="background:transparent; border:none; color:var(--team-b-score); font-weight:bold; text-align:left; width:70px;">
          </div>
        </div>
      </div>

      <div class="hud score-hud">
        <div id="server-banner" class="server-banner">
          <span id="banner-team-pill" class="banner-pill">TEAM A SERVING</span>
          <span id="banner-server-player" class="banner-detail">Server: A2 (1st)</span>
          <span id="banner-court-side" class="banner-detail">EVEN (Right)</span>
        </div>
        <div class="status-text" id="status-display">Ready</div>
        <div class="score-callout">
          <span id="score-left" class="score-left">0</span>
          <span class="score-divider">-</span>
          <span id="score-right" class="score-right">0</span>
        </div>

        <div id="initial-server-hud-row" class="game-target-row">
          <span>Starting Server:</span>
          <div style="display: inline-flex; background: #333; padding: 2px; border-radius: 6px; border: 1px solid #444;">
            <button type="button" id="toggle-serve-A" style="background: var(--team-a-score); color: #fff; border: none; padding: 4px 12px; font-size: 0.8rem; font-weight: bold; border-radius: 4px; cursor: pointer;">Team A</button>
            <button type="button" id="toggle-serve-B" style="background: transparent; color: #aaa; border: none; padding: 4px 12px; font-size: 0.8rem; font-weight: bold; border-radius: 4px; cursor: pointer;">Team B</button>
          </div>
        </div>

        <div class="game-target-row">
          <span>Game Rules:</span>
          <select id="select-game-rules" style="background: #333; color: #fff; border: none; padding: 2px 8px; border-radius: 4px; font-size: 0.8rem; cursor: pointer;">
            <option value="15">15 Points (Switch at 8)</option>
            <option value="21">21 Points (Switch at 11)</option>
          </select>
        </div>
      </div>

      <div class="handicap-controls" style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
        <button type="button" class="btn btn-teamA" id="btn-handicap-left" style="padding: 10px; font-size: 0.9rem;">+1 Handicap (Left Side)</button>
        <button type="button" class="btn btn-teamB" id="btn-handicap-right" style="padding: 10px; font-size: 0.9rem;">+1 Handicap (Right Side)</button>
      </div>

      <div class="court">
        <div class="court-half left-half">
          <div class="baseline-label" id="baseline-label-left">L</div>
          <div class="kitchen">Kitchen</div>
          <div class="baselines">
            <div class="quadrant"><div class="player-node" id="p-A-left"><input id="input-A-left" class="player-input" maxlength="3" value="A1"></div></div>
            <div class="quadrant"><div class="player-node" id="p-A-right"><input id="input-A-right" class="player-input" maxlength="3" value="A2"></div></div>
          </div>
        </div>
        <div class="net"></div>
        <div class="court-half right-half">
          <div class="baseline-label" id="baseline-label-right">R</div>
          <div class="kitchen">Kitchen</div>
          <div class="baselines">
            <div class="quadrant"><div class="player-node" id="p-B-right"><input id="input-B-right" class="player-input" maxlength="3" value="B1"></div></div>
            <div class="quadrant"><div class="player-node" id="p-B-left"><input id="input-B-left" class="player-input" maxlength="3" value="B2"></div></div>
          </div>
        </div>
      </div>

      <div class="controls">
        <button type="button" class="btn btn-teamA" id="btn-win-A">Team A Won Rally</button>
        <button type="button" class="btn btn-teamB" id="btn-win-B">Team B Won Rally</button>
        <button type="button" class="btn btn-utility" id="btn-swap-court-ccw2">Swap Court (CCW 2 Moves)</button>
        <button type="button" class="btn btn-utility" id="btn-undo">Undo Last Move</button>
        <button type="button" class="btn btn-utility" id="btn-reset">Reset Game</button>
      </div>

      <div class="fault-controls">
        <button type="button" class="btn btn-fault" id="btn-fault-A">Team A Foot Fault</button>
        <button type="button" class="btn btn-fault" id="btn-fault-serve">Serve Fault</button>
        <button type="button" class="btn btn-fault" id="btn-fault-B">Team B Foot Fault</button>
      </div>
      <div class="fault-log" id="fault-log"></div>

      <div class="hud match-summary-log-container" style="text-align: left;">
        <div style="font-weight: bold; color: var(--accent-gold); font-size: 0.9rem; margin-bottom: 6px; text-transform: uppercase;">Team Match Summary Log</div>
        <div id="match-summary-log" style="font-size: 0.8rem; color: #ddd; display: flex; flex-direction: column; gap: 4px;"></div>
      </div>
    </div>
  </div>

  <script>
    const PUBLIC_APP_URL = 'https://pickleballlog.github.io/pickleball-scoreboard/';
    const SUPABASE_CONFIG = {
      url: 'https://bfdqwreulrfsulvdrlzk.supabase.co',
      anonKey: 'sb_publishable_Vo2M8B6ptaLBPbtGK557aw_vTXFoqoF'
    };

    const urlParams = new URLSearchParams(window.location.search);
    const roomId = (urlParams.get('room') || Math.random().toString(36).substring(2, 6)).toUpperCase();
    let viewMode = urlParams.get('view') || 'control';
    let isApplyingRemoteState = false;
    let realtimeChannel = null;
    const localChannel = typeof BroadcastChannel !== 'undefined' ? new BroadcastChannel(`pb-room-${roomId}`) : null;

    let history = [];
    let faultHistory = [];
    let activeMatchIndex = 0;
    let teamMatches = [
      { name: "男雙 VS 女雙", teamAPlayers: ['M1', 'M2'], teamBPlayers: ['W1', 'W2'], scoreA: 0, scoreB: 0, completed: false, winner: null },
      { name: "男雙 VS 混雙", teamAPlayers: ['M1', 'M2'], teamBPlayers: ['M3', 'W3'], scoreA: 0, scoreB: 0, completed: false, winner: null },
      { name: "混雙 VS 女雙", teamAPlayers: ['M1', 'W1'], teamBPlayers: ['W2', 'W3'], scoreA: 0, scoreB: 0, completed: false, winner: null },
      { name: "同屬性對戰", teamAPlayers: ['A1', 'A2'], teamBPlayers: ['B1', 'B2'], scoreA: 0, scoreB: 0, completed: false, winner: null }
    ];

    let state = {
      scoreA: 0, scoreB: 0, gameTarget: 15, switchTarget: 8, gameOver: false,
      servingTeam: 'A', serverNumber: 1, isOpeningServe: true, servingPlayer: 'A2', servingSide: 'even',
      positions: { A_left: 'A1', A_right: 'A2', B_left: 'B2', B_right: 'B1' },
      endsSwitchedAt8: false, manualSwap: false, switchBadgeDismissed: false
    };

    const clone = () => JSON.parse(JSON.stringify(state));
    const getTeamScore = (t) => (t === 'A' ? state.scoreA : state.scoreB);
    const isCourtSwitched = () => state.endsSwitchedAt8 !== (state.manualSwap || false);
    const ord = (n) => (n === 1 ? '1st' : '2nd');
    const getNames = () => ({ nameA: document.getElementById('team-name-A').value, nameB: document.getElementById('team-name-B').value });

    function getServerForTeam(team) {
      const odd = getTeamScore(team) % 2 === 1;
      return team === 'A' ? (odd ? state.positions.A_left : state.positions.A_right) : (odd ? state.positions.B_left : state.positions.B_right);
    }

    function syncServer(team = state.servingTeam) {
      const odd = getTeamScore(team) % 2 === 1;
      state.servingPlayer = getServerForTeam(team);
      state.servingSide = odd ? 'odd' : 'even';
    }

    function setStartingServer(team) {
      state.servingTeam = team;
      state.serverNumber = 1;
      state.isOpeningServe = true;
      syncServer(team);
    }

    function readInputs() {
      const v = (id, fb) => ((document.getElementById(id).value || '').toUpperCase().slice(0, 3)) || fb;
      return { leftTop: v('input-A-left', 'A1'), leftBottom: v('input-A-right', 'A2'), rightTop: v('input-B-left', 'B2'), rightBottom: v('input-B-right', 'B1') };
    }

    function remapServer(oldPos) {
      const map = { [oldPos.A_left]: state.positions.A_left, [oldPos.A_right]: state.positions.A_right, [oldPos.B_right]: state.positions.B_right, [oldPos.B_left]: state.positions.B_left };
      state.servingPlayer = Object.prototype.hasOwnProperty.call(map, state.servingPlayer) ? map[state.servingPlayer] : getServerForTeam(state.servingTeam);
      const m = teamMatches[activeMatchIndex];
      m.teamAPlayers = [state.positions.A_left, state.positions.A_right];
      m.teamBPlayers = [state.positions.B_right, state.positions.B_left];
    }

    function updateCourtNames() {
      const { leftTop, leftBottom, rightTop, rightBottom } = readInputs();
      const oldPos = { ...state.positions };
      state.positions = !isCourtSwitched()
        ? { A_left: leftTop, A_right: leftBottom, B_left: rightTop, B_right: rightBottom }
        : { B_left: leftTop, B_right: leftBottom, A_left: rightTop, A_right: rightBottom };
      remapServer(oldPos);
    }

    function swapCourtCCW2() {
      if (state.gameOver) return;
      history.push(clone());
      const { leftTop, leftBottom, rightTop, rightBottom } = readInputs();
      const oldPos = { ...state.positions };
      state.positions = !isCourtSwitched()
        ? { A_left: rightTop, A_right: rightBottom, B_left: leftTop, B_right: leftBottom }
        : { B_left: rightTop, B_right: rightBottom, A_left: leftTop, A_right: leftBottom };
      remapServer(oldPos);
      render();
    }

    function highlightServer() {
      document.querySelectorAll('.pickleball-app-wrapper .player-node').forEach(n => {
        n.classList.remove('serving');
        n.querySelector('.server-indicator')?.remove();
      });
      if (!Object.values(state.positions).includes(state.servingPlayer)) state.servingPlayer = getServerForTeam(state.servingTeam);
      const sw = isCourtSwitched();
      const pos = (t, s) => state.positions[`${t}_${s}`] === state.servingPlayer;
      const id = state.servingTeam === 'A'
        ? (pos('A', 'left') ? (!sw ? 'p-A-left' : 'p-B-left') : pos('A', 'right') ? (!sw ? 'p-A-right' : 'p-B-right') : null)
        : (pos('B', 'left') ? (!sw ? 'p-B-left' : 'p-A-left') : pos('B', 'right') ? (!sw ? 'p-B-right' : 'p-A-right') : null);
      const node = id && document.getElementById(id);
      if (!node) return;
      node.classList.add('serving');
      const badge = document.createElement('span');
      badge.className = 'server-indicator';
      badge.textContent = `${ord(state.serverNumber)} Server`;
      node.appendChild(badge);
    }

    function updateHud() {
      const { nameA, nameB } = getNames();
      const servingName = state.servingTeam === 'A' ? nameA : nameB;
      const isOdd = state.servingSide === 'odd';
      const pill = document.getElementById('banner-team-pill');
      pill.textContent = state.gameOver ? 'GAME OVER' : `${servingName} SERVING`;
      pill.style.background = state.servingTeam === 'A' ? 'var(--team-a-score)' : 'var(--team-b-score)';
      pill.style.color = '#fff';
      document.getElementById('banner-server-player').textContent = `Server: ${state.servingPlayer} (${ord(state.serverNumber)})`;
      document.getElementById('banner-court-side').textContent = `${isOdd ? 'ODD' : 'EVEN'} (${isOdd ? 'Left' : 'Right'})`;

      const st = document.getElementById('status-display');
      if (state.gameOver) {
        st.textContent = `${state.scoreA > state.scoreB ? nameA : nameB} Wins! Final Score: ${state.scoreA}-${state.scoreB}`;
        st.style.color = 'var(--accent-gold)';
      } else {
        st.textContent = 'Ready';
        st.style.color = 'var(--text-dim)';
      }

      const leftEl = document.getElementById('score-left');
      const rightEl = document.getElementById('score-right');
      const aServes = state.servingTeam === 'A';
      leftEl.textContent = aServes ? state.scoreA : state.scoreB;
      rightEl.textContent = aServes ? state.scoreB : state.scoreA;
      leftEl.style.color = aServes ? 'var(--team-a-score)' : 'var(--team-b-score)';
      rightEl.style.color = aServes ? 'var(--team-b-score)' : 'var(--team-a-score)';
    }

    function render() {
      if (!document.activeElement?.classList.contains('player-input')) {
        const { A_left, A_right, B_left, B_right } = state.positions;
        const vals = !isCourtSwitched() ? [A_left, A_right, B_left, B_right] : [B_left, B_right, A_left, A_right];
        ['input-A-left', 'input-A-right', 'input-B-left', 'input-B-right'].forEach((id, i) => { document.getElementById(id).value = vals[i]; });
      }
      updateHud();
      highlightServer();

      const { nameA, nameB } = getNames();
      const sw = isCourtSwitched();
      document.getElementById('baseline-label-left').textContent = !sw ? nameA : nameB;
      document.getElementById('baseline-label-right').textContent = !sw ? nameB : nameA;

      const leftName = !sw ? nameA : nameB, rightName = !sw ? nameB : nameA;
      const leftCol = !sw ? 'var(--team-a-score)' : 'var(--team-b-score)', rightCol = !sw ? 'var(--team-b-score)' : 'var(--team-a-score)';
      document.getElementById('btn-win-A').textContent = `${leftName} Won Rally`;
      document.getElementById('btn-win-A').style.backgroundColor = leftCol;
      document.getElementById('btn-win-B').textContent = `${rightName} Won Rally`;
      document.getElementById('btn-win-B').style.backgroundColor = rightCol;
      document.getElementById('btn-fault-A').textContent = `${leftName} Foot Fault`;
      document.getElementById('btn-fault-A').style.backgroundColor = leftCol;
      document.getElementById('btn-fault-B').textContent = `${rightName} Foot Fault`;
      document.getElementById('btn-fault-B').style.backgroundColor = rightCol;
      document.getElementById('btn-handicap-left').textContent = `+1 Handicap ${leftName}`;
      document.getElementById('btn-handicap-left').style.backgroundColor = leftCol;
      document.getElementById('btn-handicap-right').textContent = `+1 Handicap ${rightName}`;
      document.getElementById('btn-handicap-right').style.backgroundColor = rightCol;

      document.getElementById('toggle-serve-A').textContent = nameA;
      document.getElementById('toggle-serve-B').textContent = nameB;
      document.getElementById('toggle-serve-A').style.background = state.servingTeam === 'A' ? 'var(--team-a-score)' : 'transparent';
      document.getElementById('toggle-serve-A').style.color = state.servingTeam === 'A' ? '#fff' : '#aaa';
      document.getElementById('toggle-serve-B').style.background = state.servingTeam === 'B' ? 'var(--team-b-score)' : 'transparent';
      document.getElementById('toggle-serve-B').style.color = state.servingTeam === 'B' ? '#fff' : '#aaa';

      const faultEl = document.getElementById('fault-log');
      faultEl.innerHTML = faultHistory.slice(-10).map(e => `<div>${e}</div>`).join('');
      faultEl.scrollTop = faultEl.scrollHeight;

      let winsA = 0, winsB = 0;
      document.getElementById('match-summary-log').innerHTML = teamMatches.map((m, i) => {
        if (m.completed) { if (m.winner === 'A') winsA++; else winsB++; }
        const active = i === activeMatchIndex;
        const st = m.completed
          ? `<b style="color:${m.winner === 'A' ? 'var(--team-a-score)' : 'var(--team-b-score)'}">${m.winner === 'A' ? nameA : nameB} Won (${m.scoreA}-${m.scoreB})</b>`
          : (active ? `<span style="color:var(--accent-gold)">In Progress (${state.scoreA}-${state.scoreB}, Server ${state.serverNumber})</span>` : 'Pending');
        return `<div style="padding:4px 6px;border-radius:4px;background:${active ? '#2d2d2d' : 'transparent'};border-left:${active ? '3px solid var(--accent-gold)' : 'none'}"><b>Game ${i + 1} [${m.name}]:</b> ${st}</div>`;
      }).join('');
      document.getElementById('event-score-A').textContent = winsA;
      document.getElementById('event-score-B').textContent = winsB;
      document.getElementById('select-game-rules').value = state.gameTarget;
      broadcastSnapshot();
    }

    function checkEnd() {
      if (!state.endsSwitchedAt8 && (state.scoreA >= state.switchTarget || state.scoreB >= state.switchTarget)) {
        state.endsSwitchedAt8 = true; state.switchBadgeDismissed = false;
      }
      if ((state.scoreA >= state.gameTarget || state.scoreB >= state.gameTarget) && Math.abs(state.scoreA - state.scoreB) >= 2) {
        state.gameOver = true;
        const m = teamMatches[activeMatchIndex];
        Object.assign(m, { completed: true, scoreA: state.scoreA, scoreB: state.scoreB, winner: state.scoreA > state.scoreB ? 'A' : 'B' });
      }
    }

    function awardPoint(winner) {
      if (state.gameOver) return;
      history.push(clone());
      if (winner === 'A') state.scoreA++; else state.scoreB++;
      state.isOpeningServe = false;
      if (winner === state.servingTeam) {
        const kL = `${winner}_left`, kR = `${winner}_right`;
        [state.positions[kL], state.positions[kR]] = [state.positions[kR], state.positions[kL]];
      } else {
        state.servingTeam = winner; state.serverNumber = 1;
      }
      syncServer(winner); checkEnd(); render();
    }

    function serverLoss() {
      if (state.gameOver) return;
      history.push(clone());
      if (state.isOpeningServe) { state.isOpeningServe = false; state.servingTeam = state.servingTeam === 'A' ? 'B' : 'A'; state.serverNumber = 1; }
      else if (state.serverNumber === 1) state.serverNumber = 2;
      else { state.servingTeam = state.servingTeam === 'A' ? 'B' : 'A'; state.serverNumber = 1; }
      syncServer(state.servingTeam); checkEnd(); render();
    }

    const sideTeam = (side) => (side === 'left' ? (!isCourtSwitched() ? 'A' : 'B') : (!isCourtSwitched() ? 'B' : 'A'));

    function loadMatch(idx) {
      activeMatchIndex = idx;
      const m = teamMatches[idx];
      history = []; faultHistory = [];
      state = {
        ...state,
        positions: { A_left: m.teamAPlayers[0], A_right: m.teamAPlayers[1], B_right: m.teamBPlayers[0], B_left: m.teamBPlayers[1] },
        scoreA: m.scoreA || 0, scoreB: m.scoreB || 0, gameOver: m.completed || false,
        servingTeam: 'A', serverNumber: 1, isOpeningServe: true, servingPlayer: m.teamAPlayers[1], servingSide: 'even',
        endsSwitchedAt8: false, manualSwap: false, switchBadgeDismissed: false
      };
      const t = parseInt(document.getElementById('select-game-rules').value, 10) || 15;
      state.gameTarget = t; state.switchTarget = t === 21 ? 11 : 8;
      document.getElementById('select-active-match').value = idx;
      render();
    }

    // QR Link & Room Sync
    document.getElementById('room-code-text').textContent = roomId;

    function getDisplayShareUrl() {
      const base = PUBLIC_APP_URL ? PUBLIC_APP_URL.replace(/\/+$/, '') + '/' : window.location.href.split('?')[0];
      return `${base}?view=display&room=${encodeURIComponent(roomId)}`;
    }

    function renderRoomQRCode() {
      const box = document.getElementById('qr-code-box');
      const label = document.getElementById('qr-url-label');
      if (!box) return;
      box.innerHTML = '';
      const url = getDisplayShareUrl();
      if (label) label.textContent = `Room ${roomId} — ${url}`;
      if (typeof QRCode !== 'undefined') {
        try { new QRCode(box, { text: url, width: 160, height: 160 }); return; } catch (_) {}
      }
      const img = document.createElement('img');
      img.alt = `Display QR for Room ${roomId}`;
      img.width = 160; img.height = 160;
      img.src = `https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=${encodeURIComponent(url)}`;
      box.appendChild(img);
    }

    function applyViewMode(mode) {
      viewMode = mode;
      const isDisplay = mode === 'display';
      document.querySelector('.pickleball-app-wrapper').classList.toggle('display-mode', isDisplay);
      document.getElementById('btn-switch-view').textContent = isDisplay ? 'Controller Mode' : 'Display Mode';
      document.getElementById('select-active-match').disabled = isDisplay;
      document.getElementById('select-game-rules').disabled = isDisplay;
      document.getElementById('team-name-A').readOnly = isDisplay;
      document.getElementById('team-name-B').readOnly = isDisplay;
      document.querySelectorAll('.player-input').forEach(el => { el.readOnly = isDisplay; });
    }

    function buildSnapshot() {
      const { nameA, nameB } = getNames();
      return { roomId, state: clone(), teamMatches, activeMatchIndex, faultHistory, teamNameA: nameA, teamNameB: nameB };
    }

    function applyRemoteSnapshot(payload) {
      if (!payload || String(payload.roomId || '').toUpperCase() !== roomId) return;
      isApplyingRemoteState = true;
      ({ state, teamMatches, activeMatchIndex, faultHistory } = payload);
      document.getElementById('team-name-A').value = payload.teamNameA;
      document.getElementById('team-name-B').value = payload.teamNameB;
      render();
      isApplyingRemoteState = false;
    }

    function broadcastSnapshot() {
      if (viewMode !== 'control' || isApplyingRemoteState) return;
      const snap = buildSnapshot();
      localChannel?.postMessage(snap);
      realtimeChannel?.send({ type: 'broadcast', event: 'score_update', payload: snap });
    }

    function initRealtimeSync() {
      if (localChannel) localChannel.onmessage = (e) => { if (viewMode === 'display') applyRemoteSnapshot(e.data); };
      if (!window.supabase || !SUPABASE_CONFIG.url || !SUPABASE_CONFIG.anonKey) {
        document.getElementById('sync-status-label').textContent = 'Local Tab Sync';
        return;
      }
      const client = window.supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.anonKey);
      realtimeChannel = client.channel(`pickleball-room-${roomId}`, { config: { broadcast: { self: false } } });
      realtimeChannel
        .on('broadcast', { event: 'score_update' }, ({ payload }) => { if (viewMode === 'display') applyRemoteSnapshot(payload); })
        .subscribe((status) => {
          const live = status === 'SUBSCRIBED';
          document.getElementById('sync-dot').classList.toggle('live', live);
          document.getElementById('sync-status-label').textContent = live ? 'Live Cloud' : status;
          if (live && viewMode === 'control') broadcastSnapshot();
        });
    }

    // Events
    document.getElementById('btn-toggle-qr').addEventListener('click', () => {
      const pop = document.getElementById('qr-popover');
      const open = pop.style.display === 'none';
      pop.style.display = open ? 'block' : 'none';
      if (open) renderRoomQRCode();
    });
    document.getElementById('btn-switch-view').addEventListener('click', () => applyViewMode(viewMode === 'display' ? 'control' : 'display'));
    document.getElementById('btn-fullscreen').addEventListener('click', async () => {
      const w = document.querySelector('.pickleball-app-wrapper');
      try { if (!document.fullscreenElement) await w.requestFullscreen(); else await document.exitFullscreen(); } catch (_) { w.classList.toggle('display-mode'); }
    });
    document.getElementById('btn-win-A').addEventListener('click', () => awardPoint(sideTeam('left')));
    document.getElementById('btn-win-B').addEventListener('click', () => awardPoint(sideTeam('right')));
    document.getElementById('btn-swap-court-ccw2').addEventListener('click', swapCourtCCW2);
    document.getElementById('btn-undo').addEventListener('click', () => {
      if (!history.length) return;
      state = history.pop();
      const m = teamMatches[activeMatchIndex];
      if (m.completed && !state.gameOver) { m.completed = false; m.winner = null; }
      render();
    });
    document.getElementById('btn-reset').addEventListener('click', () => {
      Object.assign(teamMatches[activeMatchIndex], { scoreA: 0, scoreB: 0, completed: false, winner: null });
      loadMatch(activeMatchIndex);
    });
    ['left', 'right'].forEach(side => {
      document.getElementById(side === 'left' ? 'btn-fault-A' : 'btn-fault-B').addEventListener('click', () => {
        if (state.gameOver) return;
        const t = sideTeam(side);
        const { nameA, nameB } = getNames();
        faultHistory.push(`${t === 'A' ? nameA : nameB} (${t === state.servingTeam ? `${state.servingPlayer} (${ord(state.serverNumber)})` : 'RECEIVER'}) - Foot Fault at ${state.scoreA}-${state.scoreB}`);
        if (t === state.servingTeam) serverLoss(); else awardPoint(t === 'A' ? 'B' : 'A');
      });
      document.getElementById(`btn-handicap-${side}`).addEventListener('click', () => {
        if (state.gameOver) return;
        const t = sideTeam(side);
        history.push(clone());
        if (t === 'A') state.scoreA++; else state.scoreB++;
        syncServer(t); checkEnd(); render();
      });
    });
    document.getElementById('btn-fault-serve').addEventListener('click', () => {
      if (state.gameOver) return;
      const { nameA, nameB } = getNames();
      faultHistory.push(`${state.servingTeam === 'A' ? nameA : nameB} (${state.servingPlayer} (${ord(state.serverNumber)})) - Serve Fault at ${state.scoreA}-${state.scoreB}`);
      serverLoss();
    });
    document.getElementById('select-game-rules').addEventListener('change', (e) => {
      const t = parseInt(e.target.value, 10);
      state.gameTarget = t; state.switchTarget = t === 21 ? 11 : 8;
      checkEnd(); render();
    });
    document.getElementById('select-active-match').addEventListener('change', (e) => loadMatch(parseInt(e.target.value, 10)));
    document.getElementById('team-name-A').addEventListener('input', render);
    document.getElementById('team-name-B').addEventListener('input', render);
    ['A', 'B'].forEach(t => document.getElementById(`toggle-serve-${t}`).addEventListener('click', () => { setStartingServer(t); render(); }));
    document.querySelectorAll('.player-input').forEach(inp => {
      inp.addEventListener('click', (e) => e.stopPropagation());
      inp.addEventListener('input', (e) => { e.target.value = e.target.value.toUpperCase().slice(0, 3); updateCourtNames(); updateHud(); highlightServer(); broadcastSnapshot(); });
      inp.addEventListener('change', (e) => { e.target.value = e.target.value.toUpperCase().slice(0, 3); updateCourtNames(); render(); });
    });
    document.querySelectorAll('.pickleball-app-wrapper .player-node').forEach(node => {
      node.addEventListener('click', () => {
        if (viewMode === 'display') return;
        const t = node.id.includes('-A-') ? 'A' : (node.id.includes('-B-') ? 'B' : null);
        if (t) { setStartingServer(t); render(); }
      });
    });

    applyViewMode(viewMode);
    initRealtimeSync();
    loadMatch(0);
  </script>
</body>
</html>
