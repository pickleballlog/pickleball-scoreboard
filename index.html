<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pickleball Live Court Scoreboard</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .pickleball-app-wrapper {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-main: #ffffff;
      --text-dim: #aaaaaa;
      --court-gray: #3a3a3a;
      --kitchen-blue: #0d47a1;
      --accent-gold: #ffb300;
      --btn-gray: #424242;
      --team-a-score: #2e7d32;
      --team-b-score: #ff1493;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    .pickleball-app-wrapper * {
      box-sizing: border-box;
    }
    .pickleball-app-wrapper .container {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Room & Sync Bar */
    .pickleball-app-wrapper .sync-bar {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: #1b1b1b;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 8px 12px;
      margin-bottom: 10px;
      font-size: 0.8rem;
      position: relative;
    }
    .pickleball-app-wrapper .sync-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .pickleball-app-wrapper .sync-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--accent-gold);
      display: inline-block;
    }
    .pickleball-app-wrapper .sync-dot.live {
      background: #4caf50;
    }
    .pickleball-app-wrapper .sync-status {
      color: var(--text-dim);
      font-size: 0.75rem;
    }
    .pickleball-app-wrapper .sync-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .pickleball-app-wrapper .btn-mini {
      background: #333;
      color: #fff;
      border: 1px solid #555;
      border-radius: 6px;
      padding: 5px 9px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
    }
    .pickleball-app-wrapper .qr-popover {
      position: absolute;
      top: 46px;
      right: 10px;
      background: #ffffff;
      color: #111111;
      padding: 12px;
      border-radius: 10px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.7);
      z-index: 100;
      text-align: center;
      min-width: 184px;
    }
    .pickleball-app-wrapper .qr-title {
      font-size: 0.75rem;
      font-weight: 800;
      margin-bottom: 8px;
      text-transform: uppercase;
    }
    .pickleball-app-wrapper #qr-code-box {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 160px;
    }
    .pickleball-app-wrapper .qr-url-label {
      margin-top: 8px;
      font-size: 0.65rem;
      max-width: 170px;
      word-break: break-all;
      color: #444;
    }

    /* HUD & Big Score */
    .pickleball-app-wrapper .hud {
      background-color: var(--card-bg);
      border-radius: 10px;
      border: 1px solid #333;
      padding: 16px 12px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }
    .pickleball-app-wrapper .server-banner {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .pickleball-app-wrapper .banner-pill {
      background: var(--accent-gold);
      color: #000;
      font-weight: 900;
      font-size: 0.85rem;
      padding: 4px 12px;
      border-radius: 999px;
      letter-spacing: 0.5px;
    }
    .pickleball-app-wrapper .banner-detail {
      background: #2b2b2b;
      border: 1px solid #444;
      color: #fff;
      font-weight: 700;
      font-size: 0.8rem;
      padding: 4px 10px;
      border-radius: 6px;
    }
    .pickleball-app-wrapper .status-text {
      font-size: 1rem;
      color: var(--text-dim);
      font-weight: bold;
      text-transform: uppercase;
    }
    .pickleball-app-wrapper .score-callout {
      font-size: 4rem;
      font-weight: 900;
      margin: 6px 0;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
    }
    .pickleball-app-wrapper .score-left,
    .pickleball-app-wrapper .score-right {
      font-size: 4rem;
      font-weight: 900;
    }
    .pickleball-app-wrapper .score-divider {
      color: #555;
      font-size: 2.5rem;
    }
    .pickleball-app-wrapper .game-target-row {
      width: 100%;
      margin-top: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      color: var(--text-dim);
    }

    /* Court Diagram */
    .pickleball-app-wrapper .court {
      background-color: var(--court-gray);
      border: 4px solid white;
      border-radius: 8px;
      display: flex;
      flex-direction: row;
      aspect-ratio: 20 / 11;
      position: relative;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.4);
    }
    .pickleball-app-wrapper .court-half {
      width: 50%;
      display: flex;
      flex-direction: row;
      position: relative;
    }
    .pickleball-app-wrapper .left-half {
      flex-direction: row-reverse;
    }
    .pickleball-app-wrapper .right-half {
      flex-direction: row;
    }
    .pickleball-app-wrapper .baseline-label {
      position: absolute;
      top: 6px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 1rem;
      font-weight: 900;
      color: #ffeb3b;
      text-shadow: 0 0 6px rgba(0, 0, 0, 0.8);
      background: rgba(0, 0, 0, 0.6);
      padding: 4px 12px;
      border-radius: 14px;
      letter-spacing: 1px;
      z-index: 15;
      white-space: nowrap;
    }
    .pickleball-app-wrapper .kitchen {
      width: 18%;
      background-color: var(--kitchen-blue);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.7rem;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.8);
      writing-mode: vertical-lr;
      transform: rotate(180deg);
    }
    .pickleball-app-wrapper .left-half .kitchen {
      border-left: 3px solid white;
    }
    .pickleball-app-wrapper .right-half .kitchen {
      border-right: 3px solid white;
    }
    .pickleball-app-wrapper .baselines {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .pickleball-app-wrapper .quadrant {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      border-bottom: 2px dashed rgba(255, 255, 255, 0.5);
    }
    .pickleball-app-wrapper .quadrant:last-child {
      border-bottom: none;
    }
    .pickleball-app-wrapper .net {
      width: 6px;
      background-color: #111;
      height: 100%;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
    }
    .pickleball-app-wrapper .player-node {
      position: relative;
      background: rgba(0, 0, 0, 0.8);
      padding: 6px 10px;
      border-radius: 20px;
      border: 2px solid transparent;
      text-align: center;
      width: 80%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .pickleball-app-wrapper .player-input {
      background: transparent;
      border: none;
      border-bottom: 1px solid #777;
      color: #fff;
      width: 80%;
      text-align: center;
      text-transform: uppercase;
      font-size: 0.9rem;
    }
    .pickleball-app-wrapper .player-input:focus {
      outline: none;
      border-bottom-color: var(--accent-gold);
    }
    .pickleball-app-wrapper .left-half .player-node {
      border-color: rgba(76, 175, 80, 0.4);
    }
    .pickleball-app-wrapper .right-half .player-node {
      border-color: rgba(255, 20, 147, 0.3);
    }
    .pickleball-app-wrapper .player-node.serving {
      border-color: var(--accent-gold) !important;
      box-shadow: 0 0 12px var(--accent-gold);
    }
    .pickleball-app-wrapper .player-node.serving::before {
      content: "SERVING";
      position: absolute;
      top: -10px;
      background: var(--accent-gold);
      color: #000;
      font-size: 0.6rem;
      font-weight: 900;
      padding: 1px 6px;
      border-radius: 4px;
      letter-spacing: 0.5px;
    }
    .pickleball-app-wrapper .server-indicator {
      color: var(--accent-gold);
      font-size: 0.65rem;
      font-weight: 700;
      display: block;
      margin-top: 2px;
      text-transform: uppercase;
    }

    /* Referee Controls & Logs (Hidden on Display Mode) */
    .pickleball-app-wrapper .controls {
      margin-top: 10px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .pickleball-app-wrapper .btn {
      padding: 16px;
      font-size: 1.05rem;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      color: white;
    }
    .pickleball-app-wrapper .btn:active {
      opacity: 0.8;
    }
    .pickleball-app-wrapper .btn-teamA {
      background-color: var(--team-a-score);
    }
    .pickleball-app-wrapper .btn-teamB {
      background-color: var(--team-b-score);
    }
    .pickleball-app-wrapper .btn-utility {
      background-color: var(--btn-gray);
      grid-column: span 2;
      padding: 12px;
      font-size: 0.95rem;
    }
    .pickleball-app-wrapper .fault-controls {
      margin-top: 8px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .pickleball-app-wrapper .btn-fault {
      padding: 10px;
      font-size: 0.85rem;
      color: white;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .pickleball-app-wrapper #btn-fault-serve {
      background-color: var(--accent-gold);
      color: #000;
    }
    .pickleball-app-wrapper .fault-log {
      margin-top: 8px;
      font-size: 0.8rem;
      color: var(--text-dim);
      max-height: 80px;
      overflow-y: auto;
      text-align: left;
      padding: 6px 8px;
      border-radius: 6px;
      background: #1b1b1b;
      border: 1px solid #333;
    }

    /* Addon #2: Per-Room Rally & Fault Match Log */
    .pickleball-app-wrapper .room-event-log-card {
      text-align: left;
    }
    .pickleball-app-wrapper .room-event-log-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .pickleball-app-wrapper .room-event-log-title {
      font-weight: bold;
      color: var(--accent-gold);
      font-size: 0.9rem;
      text-transform: uppercase;
    }
    .pickleball-app-wrapper .room-event-log-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .pickleball-app-wrapper .room-event-log-list {
      max-height: 190px;
      overflow-y: auto;
      background: #161616;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 0.78rem;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .pickleball-app-wrapper .log-row {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 6px;
      padding: 4px 6px;
      border-radius: 4px;
      background: #202020;
      border-left: 3px solid #555;
    }
    .pickleball-app-wrapper .log-row.rally {
      border-left-color: #4caf50;
    }
    .pickleball-app-wrapper .log-row.fault {
      border-left-color: #ff9800;
    }
    .pickleball-app-wrapper .log-row.system {
      border-left-color: #64b5f6;
    }
    .pickleball-app-wrapper .log-time {
      color: var(--text-dim);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.72rem;
    }
    .pickleball-app-wrapper .log-score-pill {
      background: #2d2d2d;
      color: #fff;
      font-weight: 800;
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 0.74rem;
    }
    .pickleball-app-wrapper .log-detail {
      color: #e6e6e6;
    }

    /* Addon #1: Multi-Room Referee Dashboard */
    .pickleball-app-wrapper .rooms-dashboard {
      width: 100%;
      max-width: 960px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .pickleball-app-wrapper .dashboard-header {
      background: var(--card-bg);
      border: 1px solid #333;
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .pickleball-app-wrapper .dashboard-title {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--accent-gold);
    }
    .pickleball-app-wrapper .dashboard-subtitle {
      font-size: 0.8rem;
      color: var(--text-dim);
      margin-top: 2px;
    }
    .pickleball-app-wrapper .rooms-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 12px;
    }
    .pickleball-app-wrapper .room-card {
      background: var(--card-bg);
      border: 1px solid #383838;
      border-radius: 10px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }
    .pickleball-app-wrapper .room-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .pickleball-app-wrapper .room-badge {
      background: rgba(255, 179, 0, 0.16);
      color: var(--accent-gold);
      border: 1px solid var(--accent-gold);
      border-radius: 6px;
      padding: 3px 8px;
      font-weight: 800;
      font-size: 0.85rem;
      letter-spacing: 0.5px;
    }
    .pickleball-app-wrapper .room-meta-pill {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 999px;
      background: #2b2b2b;
      color: #ddd;
    }
    .pickleball-app-wrapper .room-event-line {
      font-size: 0.8rem;
      color: var(--text-dim);
      font-weight: 700;
    }
    .pickleball-app-wrapper .room-teams-line {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      font-weight: 700;
    }
    .pickleball-app-wrapper .room-score-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 8px 0;
      background: #161616;
      border-radius: 8px;
      border: 1px solid #2c2c2c;
    }
    .pickleball-app-wrapper .room-score-a {
      font-size: 2.2rem;
      font-weight: 900;
      color: var(--team-a-score);
    }
    .pickleball-app-wrapper .room-score-sep {
      font-size: 1.4rem;
      color: #666;
      font-weight: 800;
    }
    .pickleball-app-wrapper .room-score-b {
      font-size: 2.2rem;
      font-weight: 900;
      color: var(--team-b-score);
    }
    .pickleball-app-wrapper .room-server-line {
      font-size: 0.78rem;
      color: #e0e0e0;
      display: flex;
      justify-content: space-between;
      gap: 6px;
    }
    .pickleball-app-wrapper .room-card-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 2px;
    }
    .pickleball-app-wrapper .room-link-btn {
      text-align: center;
      text-decoration: none;
      background: #2d2d2d;
      color: #fff;
      border: 1px solid #555;
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 0.75rem;
      font-weight: 700;
    }
    .pickleball-app-wrapper .room-empty-state {
      background: var(--card-bg);
      border: 1px dashed #444;
      border-radius: 10px;
      padding: 28px 18px;
      text-align: center;
      color: var(--text-dim);
      font-size: 0.9rem;
    }

    .pickleball-app-wrapper.dashboard-mode .container {
      display: none !important;
    }
    .pickleball-app-wrapper.dashboard-mode .rooms-dashboard {
      display: flex !important;
    }
    .pickleball-app-wrapper.dashboard-mode .sync-bar {
      max-width: 960px;
    }

    /* Display Mode: Show ONLY Room Indicator + Big Score + Game Rule + Court Diagram & Server Indicator */
    .pickleball-app-wrapper.display-mode {
      justify-content: center;
      padding: 24px;
    }
    .pickleball-app-wrapper.display-mode .container {
      max-width: 840px;
      gap: 16px;
    }
    .pickleball-app-wrapper.display-mode .event-header,
    .pickleball-app-wrapper.display-mode .controls,
    .pickleball-app-wrapper.display-mode .fault-controls,
    .pickleball-app-wrapper.display-mode .fault-log,
    .pickleball-app-wrapper.display-mode .handicap-controls,
    .pickleball-app-wrapper.display-mode .match-summary-log-container,
    .pickleball-app-wrapper.display-mode .room-event-log-card,
    .pickleball-app-wrapper.display-mode #initial-server-hud-row,
    .pickleball-app-wrapper.display-mode .sync-actions,
    .pickleball-app-wrapper.display-mode .banner-pill,
    .pickleball-app-wrapper.display-mode .banner-detail,
    .pickleball-app-wrapper.display-mode .status-text,
    .pickleball-app-wrapper.display-mode .rooms-dashboard {
      display: none !important;
    }
    .pickleball-app-wrapper.display-mode .sync-bar {
      max-width: 840px;
      margin-bottom: 0;
      padding: 10px 16px;
      font-size: 0.95rem;
    }
    .pickleball-app-wrapper.display-mode #room-code-text {
      color: var(--accent-gold);
      font-size: 1.05rem;
      letter-spacing: 1px;
    }
    .pickleball-app-wrapper.display-mode .score-hud {
      padding: 26px 20px;
    }
    .pickleball-app-wrapper.display-mode .score-callout,
    .pickleball-app-wrapper.display-mode .score-left,
    .pickleball-app-wrapper.display-mode .score-right {
      font-size: 5.75rem;
    }
    .pickleball-app-wrapper.display-mode .score-divider {
      font-size: 3.75rem;
    }
    .pickleball-app-wrapper.display-mode .game-target-row {
      display: flex !important;
      font-size: 1rem;
      margin-top: 10px;
    }
    .pickleball-app-wrapper.display-mode #select-game-rules {
      pointer-events: none;
      appearance: none;
      -webkit-appearance: none;
      font-size: 0.95rem;
      font-weight: 700;
    }
    .pickleball-app-wrapper.display-mode .court {
      display: flex !important;
    }
    .pickleball-app-wrapper.display-mode .player-input {
      pointer-events: none;
      border-bottom-color: transparent;
      font-size: 1.15rem;
      font-weight: 800;
    }
    .pickleball-app-wrapper.display-mode .server-indicator {
      font-size: 0.8rem;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <div class="pickleball-app-wrapper">
    <div id="sync-bar" class="sync-bar">
      <div class="sync-left">
        <span id="sync-dot" class="sync-dot"></span>
        <span>Room: <strong id="room-code-text">----</strong></span>
        <span id="sync-status-label" class="sync-status">Local</span>
      </div>
      <div class="sync-actions">
        <button type="button" id="btn-open-dashboard" class="btn-mini">All Rooms</button>
        <button type="button" id="btn-toggle-qr" class="btn-mini">QR Link</button>
        <button type="button" id="btn-switch-view" class="btn-mini">Display Mode</button>
        <button type="button" id="btn-fullscreen" class="btn-mini">Full Screen</button>
      </div>
      <div id="qr-popover" class="qr-popover" style="display: none;">
        <div class="qr-title">Scan for Display TV</div>
        <div id="qr-code-box"></div>
        <div id="qr-url-label" class="qr-url-label"></div>
      </div>
    </div>

    <div id="rooms-dashboard" class="rooms-dashboard" style="display: none;">
      <div class="dashboard-header">
        <div>
          <div class="dashboard-title">Live Referee Rooms Dashboard</div>
          <div id="dashboard-room-count" class="dashboard-subtitle">0 active rooms detected</div>
        </div>
        <div style="display: flex; gap: 8px; flex-wrap: wrap;">
          <button type="button" id="btn-dashboard-prune" class="btn-mini">Clear Idle (&gt;5m)</button>
          <button type="button" id="btn-dashboard-back" class="btn-mini">Back to Court</button>
        </div>
      </div>
      <div id="rooms-grid" class="rooms-grid"></div>
    </div>

    <div class="container">
      <div class="hud event-header" style="background: #252525; border: 1px solid var(--accent-gold); margin-bottom: 8px; padding: 6px 12px;">
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px;">
          <div style="display: flex; align-items: center; gap: 8px;">
            <span style="font-size: 0.75rem; color: var(--accent-gold); font-weight: bold; text-transform: uppercase;">Event:</span>
            <select id="select-active-match" style="background: #333; color: #fff; border: 1px solid #555; padding: 2px 6px; border-radius: 4px; font-size: 0.8rem;">
              <option value="0">Game 1: 男雙 VS 女雙</option>
              <option value="1">Game 2: 男雙 VS 混雙</option>
              <option value="2">Game 3: 混雙 VS 女雙</option>
              <option value="3">Game 4: 同屬性對戰</option>
            </select>
          </div>
          <div style="display: flex; align-items: center; gap: 6px; font-size: 0.85rem;">
            <input id="team-name-A" value="Team A" style="background:transparent; border:none; color:var(--team-a-score); font-weight:bold; text-align:right; width:70px;">
            <span id="event-score-A" style="font-size: 1.1rem; font-weight: 900; color: var(--team-a-score);">0</span>
            <span style="color: #777; font-weight: bold;">:</span>
            <span id="event-score-B" style="font-size: 1.1rem; font-weight: 900; color: var(--team-b-score);">0</span>
            <input id="team-name-B" value="Team B" style="background:transparent; border:none; color:var(--team-b-score); font-weight:bold; text-align:left; width:70px;">
          </div>
        </div>
      </div>

      <div class="hud score-hud">
        <div id="server-banner" class="server-banner">
          <span id="banner-team-pill" class="banner-pill">TEAM A SERVING</span>
          <span id="banner-server-player" class="banner-detail">Server: A2 (1st)</span>
          <span id="banner-court-side" class="banner-detail">EVEN (Right)</span>
        </div>
        <div class="status-text" id="status-display">Ready</div>
        <div class="score-callout">
          <span id="score-left" class="score-left">0</span>
          <span class="score-divider">-</span>
          <span id="score-right" class="score-right">0</span>
        </div>

        <div id="initial-server-hud-row" class="game-target-row">
          <span>Starting Server:</span>
          <div style="display: inline-flex; background: #333; padding: 2px; border-radius: 6px; border: 1px solid #444;">
            <button type="button" id="toggle-serve-A" style="background: var(--team-a-score); color: #fff; border: none; padding: 4px 12px; font-size: 0.8rem; font-weight: bold; border-radius: 4px; cursor: pointer;">Team A</button>
            <button type="button" id="toggle-serve-B" style="background: transparent; color: #aaa; border: none; padding: 4px 12px; font-size: 0.8rem; font-weight: bold; border-radius: 4px; cursor: pointer;">Team B</button>
          </div>
        </div>

        <div class="game-target-row">
          <span>Game Rules:</span>
          <select id="select-game-rules" style="background: #333; color: #fff; border: none; padding: 2px 8px; border-radius: 4px; font-size: 0.8rem; cursor: pointer;">
            <option value="15">15 Points (Switch at 8)</option>
            <option value="21">21 Points (Switch at 11)</option>
          </select>
        </div>
      </div>

      <div class="handicap-controls" style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
        <button type="button" class="btn btn-teamA" id="btn-handicap-left" style="padding: 10px; font-size: 0.9rem;">+1 Handicap (Left Side)</button>
        <button type="button" class="btn btn-teamB" id="btn-handicap-right" style="padding: 10px; font-size: 0.9rem;">+1 Handicap (Right Side)</button>
      </div>

      <div class="court">
        <div class="court-half left-half">
          <div class="baseline-label" id="baseline-label-left">L</div>
          <div class="kitchen">Kitchen</div>
          <div class="baselines">
            <div class="quadrant"><div class="player-node" id="p-A-left"><input id="input-A-left" class="player-input" maxlength="3" value="A1"></div></div>
            <div class="quadrant"><div class="player-node" id="p-A-right"><input id="input-A-right" class="player-input" maxlength="3" value="A2"></div></div>
          </div>
        </div>
        <div class="net"></div>
        <div class="court-half right-half">
          <div class="baseline-label" id="baseline-label-right">R</div>
          <div class="kitchen">Kitchen</div>
          <div class="baselines">
            <div class="quadrant"><div class="player-node" id="p-B-right"><input id="input-B-right" class="player-input" maxlength="3" value="B1"></div></div>
            <div class="quadrant"><div class="player-node" id="p-B-left"><input id="input-B-left" class="player-input" maxlength="3" value="B2"></div></div>
          </div>
        </div>
      </div>

      <div class="controls">
        <button type="button" class="btn btn-teamA" id="btn-win-A">Team A Won Rally</button>
        <button type="button" class="btn btn-teamB" id="btn-win-B">Team B Won Rally</button>
        <button type="button" class="btn btn-utility" id="btn-swap-court-ccw2">Swap Court (CCW 2 Moves)</button>
        <button type="button" class="btn btn-utility" id="btn-undo">Undo Last Move</button>
        <button type="button" class="btn btn-utility" id="btn-reset">Reset Game</button>
      </div>

      <div class="fault-controls">
        <button type="button" class="btn btn-fault" id="btn-fault-A">Team A Foot Fault</button>
        <button type="button" class="btn btn-fault" id="btn-fault-serve">Serve Fault</button>
        <button type="button" class="btn btn-fault" id="btn-fault-B">Team B Foot Fault</button>
      </div>
      <div class="fault-log" id="fault-log"></div>

      <div class="hud room-event-log-card">
        <div class="room-event-log-header">
          <div class="room-event-log-title">Room <span id="log-room-badge">----</span> Rally &amp; Fault Log (<span id="room-log-count">0</span>)</div>
          <div class="room-event-log-actions">
            <button type="button" id="btn-export-csv" class="btn-mini">Export CSV</button>
            <button type="button" id="btn-export-json" class="btn-mini">Export JSON</button>
            <button type="button" id="btn-clear-room-log" class="btn-mini">Clear Log</button>
          </div>
        </div>
        <div id="room-event-log-list" class="room-event-log-list"></div>
      </div>

      <div class="hud match-summary-log-container" style="text-align: left;">
        <div style="font-weight: bold; color: var(--accent-gold); font-size: 0.9rem; margin-bottom: 6px; text-transform: uppercase;">Team Match Summary Log</div>
        <div id="match-summary-log" style="font-size: 0.8rem; color: #ddd; display: flex; flex-direction: column; gap: 4px;"></div>
      </div>
    </div>
  </div>

  <script>
    const PUBLIC_APP_URL = 'https://pickleballlog.github.io/pickleball-scoreboard/';
    const SUPABASE_CONFIG = {
      url: 'https://bfdqwreulrfsulvdrlzk.supabase.co',
      anonKey: 'sb_publishable_Vo2M8B6ptaLBPbtGK557aw_vTXFoqoF'
    };

    const urlParams = new URLSearchParams(window.location.search);
    const roomId = (urlParams.get('room') || Math.random().toString(36).substring(2, 6)).toUpperCase();
    const rawView = urlParams.get('view');
    let viewMode = rawView === 'display' ? 'display' : (rawView === 'dashboard' ? 'dashboard' : 'control');
    let isApplyingRemoteState = false;
    let realtimeChannel = null;
    let lobbyChannel = null;
    let heartbeatTimer = null;
    const liveRoomsMap = new Map();
    const localChannel = typeof BroadcastChannel !== 'undefined' ? new BroadcastChannel(`pb-room-${roomId}`) : null;
    const lobbyLocalChannel = typeof BroadcastChannel !== 'undefined' ? new BroadcastChannel('pb-rooms-lobby') : null;

    // Addon #2: Per-Room Persistent Rally & Fault Event Log
    const ROOM_LOG_STORAGE_KEY = `pb_match_log_${roomId}`;
    let matchEventLog = loadStoredRoomLog();

    function loadStoredRoomLog() {
      try {
        const raw = localStorage.getItem(ROOM_LOG_STORAGE_KEY);
        const parsed = raw ? JSON.parse(raw) : [];
        return Array.isArray(parsed) ? parsed : [];
      } catch (_) {
        return [];
      }
    }

    function saveStoredRoomLog() {
      try {
        localStorage.setItem(ROOM_LOG_STORAGE_KEY, JSON.stringify(matchEventLog));
      } catch (_) {}
    }

    let history = [];
    let faultHistory = [];
    let activeMatchIndex = 0;
    let teamMatches = [
      { name: "男雙 VS 女雙", teamAPlayers: ['M1', 'M2'], teamBPlayers: ['W1', 'W2'], scoreA: 0, scoreB: 0, completed: false, winner: null },
      { name: "男雙 VS 混雙", teamAPlayers: ['M1', 'M2'], teamBPlayers: ['M3', 'W3'], scoreA: 0, scoreB: 0, completed: false, winner: null },
      { name: "混雙 VS 女雙", teamAPlayers: ['M1', 'W1'], teamBPlayers: ['W2', 'W3'], scoreA: 0, scoreB: 0, completed: false, winner: null },
      { name: "同屬性對戰", teamAPlayers: ['A1', 'A2'], teamBPlayers: ['B1', 'B2'], scoreA: 0, scoreB: 0, completed: false, winner: null }
    ];

    let state = {
      scoreA: 0, scoreB: 0, gameTarget: 15, switchTarget: 8, gameOver: false,
      servingTeam: 'A', serverNumber: 1, isOpeningServe: true, servingPlayer: 'A2', servingSide: 'even',
      positions: { A_left: 'A1', A_right: 'A2', B_left: 'B2', B_right: 'B1' },
      endsSwitchedAt8: false, manualSwap: false, switchBadgeDismissed: false
    };

    const clone = () => JSON.parse(JSON.stringify(state));
    const getTeamScore = (t) => (t === 'A' ? state.scoreA : state.scoreB);
    const isCourtSwitched = () => state.endsSwitchedAt8 !== (state.manualSwap || false);
    const ord = (n) => (n === 1 ? '1st' : '2nd');
    const getNames = () => ({
      nameA: document.getElementById('team-name-A').value,
      nameB: document.getElementById('team-name-B').value
    });

    function recordRoomEvent(category, actionType, detail) {
      if (viewMode !== 'control' || isApplyingRemoteState) return;
      const { nameA, nameB } = getNames();
      const matchObj = teamMatches[activeMatchIndex] || {};
      const now = new Date();
      const entry = {
        seq: matchEventLog.length + 1,
        timestamp: now.toISOString(),
        timeLabel: now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
        roomId,
        gameNumber: activeMatchIndex + 1,
        eventName: matchObj.name || `Game ${activeMatchIndex + 1}`,
        category, // 'rally' | 'fault' | 'system'
        actionType,
        scoreA: state.scoreA,
        scoreB: state.scoreB,
        scoreLabel: `${state.scoreA}-${state.scoreB}`,
        servingTeam: state.servingTeam === 'A' ? nameA : nameB,
        servingPlayer: state.servingPlayer,
        serverNumber: state.serverNumber,
        detail
      };
      matchEventLog.push(entry);
      saveStoredRoomLog();
    }

    function renderRoomEventLog() {
      const badge = document.getElementById('log-room-badge');
      const countEl = document.getElementById('room-log-count');
      const listEl = document.getElementById('room-event-log-list');
      if (badge) badge.textContent = roomId;
      if (countEl) countEl.textContent = String(matchEventLog.length);
      if (!listEl) return;

      if (!matchEventLog.length) {
        listEl.innerHTML = `<div style="color: var(--text-dim); padding: 4px;">No rallies or faults logged in Room ${roomId} yet.</div>`;
        return;
      }

      listEl.innerHTML = matchEventLog.slice(-50).map(item => `
        <div class="log-row ${item.category || 'system'}">
          <span class="log-time">#${item.seq} ${item.timeLabel}</span>
          <span class="log-score-pill">${item.scoreLabel}</span>
          <span class="log-detail"><b>[G${item.gameNumber} ${item.actionType}]</b> ${item.detail}</span>
        </div>
      `).join('');
      listEl.scrollTop = listEl.scrollHeight;
    }

    function downloadFile(filename, content, mimeType) {
      const blob = new Blob([content], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function exportRoomLogCsv() {
      const headers = [
        'seq', 'timestamp', 'room_id', 'game_number', 'event_name',
        'category', 'action_type', 'score_a', 'score_b',
        'serving_team', 'serving_player', 'server_number', 'detail'
      ];
      const escapeCsv = (val) => `"${String(val ?? '').replace(/"/g, '""')}"`;
      const rows = matchEventLog.map(r => [
        r.seq, r.timestamp, r.roomId, r.gameNumber, r.eventName,
        r.category, r.actionType, r.scoreA, r.scoreB,
        r.servingTeam, r.servingPlayer, r.serverNumber, r.detail
      ].map(escapeCsv).join(','));
      const csv = '\uFEFF' + [headers.join(','), ...rows].join('\n');
      const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
      downloadFile(`pickleball-room-${roomId}-log-${stamp}.csv`, csv, 'text/csv;charset=utf-8;');
    }

    function exportRoomLogJson() {
      const payload = {
        exportedAt: new Date().toISOString(),
        roomId,
        totalEvents: matchEventLog.length,
        teamMatches,
        events: matchEventLog
      };
      const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
      downloadFile(`pickleball-room-${roomId}-log-${stamp}.json`, JSON.stringify(payload, null, 2), 'application/json');
    }

    function getServerForTeam(team) {
      const odd = getTeamScore(team) % 2 === 1;
      return team === 'A'
        ? (odd ? state.positions.A_left : state.positions.A_right)
        : (odd ? state.positions.B_left : state.positions.B_right);
    }

    function syncServer(team = state.servingTeam) {
      const odd = getTeamScore(team) % 2 === 1;
      state.servingPlayer = getServerForTeam(team);
      state.servingSide = odd ? 'odd' : 'even';
    }

    function setStartingServer(team) {
      state.servingTeam = team;
      state.serverNumber = 1;
      state.isOpeningServe = true;
      syncServer(team);
    }

    function readInputs() {
      const v = (id, fb) => ((document.getElementById(id).value || '').toUpperCase().slice(0, 3)) || fb;
      return {
        leftTop: v('input-A-left', 'A1'),
        leftBottom: v('input-A-right', 'A2'),
        rightTop: v('input-B-left', 'B2'),
        rightBottom: v('input-B-right', 'B1')
      };
    }

    function remapServer(oldPos) {
      const map = {
        [oldPos.A_left]: state.positions.A_left,
        [oldPos.A_right]: state.positions.A_right,
        [oldPos.B_right]: state.positions.B_right,
        [oldPos.B_left]: state.positions.B_left
      };
      state.servingPlayer = Object.prototype.hasOwnProperty.call(map, state.servingPlayer)
        ? map[state.servingPlayer]
        : getServerForTeam(state.servingTeam);
      const m = teamMatches[activeMatchIndex];
      m.teamAPlayers = [state.positions.A_left, state.positions.A_right];
      m.teamBPlayers = [state.positions.B_right, state.positions.B_left];
    }

    function updateCourtNames() {
      const { leftTop, leftBottom, rightTop, rightBottom } = readInputs();
      const oldPos = { ...state.positions };
      state.positions = !isCourtSwitched()
        ? { A_left: leftTop, A_right: leftBottom, B_left: rightTop, B_right: rightBottom }
        : { B_left: leftTop, B_right: leftBottom, A_left: rightTop, A_right: rightBottom };
      remapServer(oldPos);
    }

    function swapCourtCCW2() {
      if (state.gameOver) return;
      history.push(clone());
      const { leftTop, leftBottom, rightTop, rightBottom } = readInputs();
      const oldPos = { ...state.positions };
      state.positions = !isCourtSwitched()
        ? { A_left: rightTop, A_right: rightBottom, B_left: leftTop, B_right: leftBottom }
        : { B_left: rightTop, B_right: rightBottom, A_left: leftTop, A_right: leftBottom };
      remapServer(oldPos);
      recordRoomEvent('system', 'COURT SWAP', 'Manual CCW court swap');
      render();
    }

    function highlightServer() {
      document.querySelectorAll('.pickleball-app-wrapper .player-node').forEach(n => {
        n.classList.remove('serving');
        n.querySelector('.server-indicator')?.remove();
      });
      if (!Object.values(state.positions).includes(state.servingPlayer)) {
        state.servingPlayer = getServerForTeam(state.servingTeam);
      }
      const sw = isCourtSwitched();
      const pos = (t, s) => state.positions[`${t}_${s}`] === state.servingPlayer;
      const id = state.servingTeam === 'A'
        ? (pos('A', 'left') ? (!sw ? 'p-A-left' : 'p-B-left') : pos('A', 'right') ? (!sw ? 'p-A-right' : 'p-B-right') : null)
        : (pos('B', 'left') ? (!sw ? 'p-B-left' : 'p-A-left') : pos('B', 'right') ? (!sw ? 'p-B-right' : 'p-A-right') : null);
      const node = id && document.getElementById(id);
      if (!node) return;
      node.classList.add('serving');
      const badge = document.createElement('span');
      badge.className = 'server-indicator';
      badge.textContent = `${ord(state.serverNumber)} Server`;
      node.appendChild(badge);
    }

    function updateHud() {
      const { nameA, nameB } = getNames();
      const servingName = state.servingTeam === 'A' ? nameA : nameB;
      const isOdd = state.servingSide === 'odd';
      const pill = document.getElementById('banner-team-pill');
      pill.textContent = state.gameOver ? 'GAME OVER' : `${servingName} SERVING`;
      pill.style.background = state.servingTeam === 'A' ? 'var(--team-a-score)' : 'var(--team-b-score)';
      pill.style.color = '#fff';
      document.getElementById('banner-server-player').textContent = `Server: ${state.servingPlayer} (${ord(state.serverNumber)})`;
      document.getElementById('banner-court-side').textContent = `${isOdd ? 'ODD' : 'EVEN'} (${isOdd ? 'Left' : 'Right'})`;

      const st = document.getElementById('status-display');
      if (state.gameOver) {
        st.textContent = `${state.scoreA > state.scoreB ? nameA : nameB} Wins! Final Score: ${state.scoreA}-${state.scoreB}`;
        st.style.color = 'var(--accent-gold)';
      } else {
        st.textContent = 'Ready';
        st.style.color = 'var(--text-dim)';
      }

      const leftEl = document.getElementById('score-left');
      const rightEl = document.getElementById('score-right');
      const aServes = state.servingTeam === 'A';
      leftEl.textContent = aServes ? state.scoreA : state.scoreB;
      rightEl.textContent = aServes ? state.scoreB : state.scoreA;
      leftEl.style.color = aServes ? 'var(--team-a-score)' : 'var(--team-b-score)';
      rightEl.style.color = aServes ? 'var(--team-b-score)' : 'var(--team-a-score)';
    }

    function render() {
      if (!document.activeElement?.classList.contains('player-input')) {
        const { A_left, A_right, B_left, B_right } = state.positions;
        const vals = !isCourtSwitched() ? [A_left, A_right, B_left, B_right] : [B_left, B_right, A_left, A_right];
        ['input-A-left', 'input-A-right', 'input-B-left', 'input-B-right'].forEach((id, i) => {
          document.getElementById(id).value = vals[i];
        });
      }
      updateHud();
      highlightServer();

      const { nameA, nameB } = getNames();
      const sw = isCourtSwitched();
      document.getElementById('baseline-label-left').textContent = !sw ? nameA : nameB;
      document.getElementById('baseline-label-right').textContent = !sw ? nameB : nameA;

      const leftName = !sw ? nameA : nameB;
      const rightName = !sw ? nameB : nameA;
      const leftCol = !sw ? 'var(--team-a-score)' : 'var(--team-b-score)';
      const rightCol = !sw ? 'var(--team-b-score)' : 'var(--team-a-score)';
      document.getElementById('btn-win-A').textContent = `${leftName} Won Rally`;
      document.getElementById('btn-win-A').style.backgroundColor = leftCol;
      document.getElementById('btn-win-B').textContent = `${rightName} Won Rally`;
      document.getElementById('btn-win-B').style.backgroundColor = rightCol;
      document.getElementById('btn-fault-A').textContent = `${leftName} Foot Fault`;
      document.getElementById('btn-fault-A').style.backgroundColor = leftCol;
      document.getElementById('btn-fault-B').textContent = `${rightName} Foot Fault`;
      document.getElementById('btn-fault-B').style.backgroundColor = rightCol;
      document.getElementById('btn-handicap-left').textContent = `+1 Handicap ${leftName}`;
      document.getElementById('btn-handicap-left').style.backgroundColor = leftCol;
      document.getElementById('btn-handicap-right').textContent = `+1 Handicap ${rightName}`;
      document.getElementById('btn-handicap-right').style.backgroundColor = rightCol;

      document.getElementById('toggle-serve-A').textContent = nameA;
      document.getElementById('toggle-serve-B').textContent = nameB;
      document.getElementById('toggle-serve-A').style.background = state.servingTeam === 'A' ? 'var(--team-a-score)' : 'transparent';
      document.getElementById('toggle-serve-A').style.color = state.servingTeam === 'A' ? '#fff' : '#aaa';
      document.getElementById('toggle-serve-B').style.background = state.servingTeam === 'B' ? 'var(--team-b-score)' : 'transparent';
      document.getElementById('toggle-serve-B').style.color = state.servingTeam === 'B' ? '#fff' : '#aaa';

      const faultEl = document.getElementById('fault-log');
      faultEl.innerHTML = faultHistory.slice(-10).map(e => `<div>${e}</div>`).join('');
      faultEl.scrollTop = faultEl.scrollHeight;

      renderRoomEventLog();

      let winsA = 0, winsB = 0;
      document.getElementById('match-summary-log').innerHTML = teamMatches.map((m, i) => {
        if (m.completed) {
          if (m.winner === 'A') winsA++;
          else winsB++;
        }
        const active = i === activeMatchIndex;
        const st = m.completed
          ? `<b style="color:${m.winner === 'A' ? 'var(--team-a-score)' : 'var(--team-b-score)'}">${m.winner === 'A' ? nameA : nameB} Won (${m.scoreA}-${m.scoreB})</b>`
          : (active ? `<span style="color:var(--accent-gold)">In Progress (${state.scoreA}-${state.scoreB}, Server ${state.serverNumber})</span>` : 'Pending');
        return `<div style="padding:4px 6px;border-radius:4px;background:${active ? '#2d2d2d' : 'transparent'};border-left:${active ? '3px solid var(--accent-gold)' : 'none'}"><b>Game ${i + 1} [${m.name}]:</b> ${st}</div>`;
      }).join('');
      document.getElementById('event-score-A').textContent = winsA;
      document.getElementById('event-score-B').textContent = winsB;
      document.getElementById('select-game-rules').value = state.gameTarget;
      broadcastSnapshot();
    }

    function checkEnd() {
      if (!state.endsSwitchedAt8 && (state.scoreA >= state.switchTarget || state.scoreB >= state.switchTarget)) {
        state.endsSwitchedAt8 = true;
        state.switchBadgeDismissed = false;
        recordRoomEvent('system', 'ENDS SWITCHED', `Reached ${state.switchTarget} pts switch mark`);
      }
      if ((state.scoreA >= state.gameTarget || state.scoreB >= state.gameTarget) && Math.abs(state.scoreA - state.scoreB) >= 2) {
        state.gameOver = true;
        const { nameA, nameB } = getNames();
        const winnerTeam = state.scoreA > state.scoreB ? 'A' : 'B';
        const m = teamMatches[activeMatchIndex];
        Object.assign(m, {
          completed: true,
          scoreA: state.scoreA,
          scoreB: state.scoreB,
          winner: winnerTeam
        });
        recordRoomEvent('system', 'GAME FINAL', `${winnerTeam === 'A' ? nameA : nameB} won ${state.scoreA}-${state.scoreB}`);
      }
    }

    function awardPoint(winner, customDetail) {
      if (state.gameOver) return;
      history.push(clone());
      const { nameA, nameB } = getNames();
      const winName = winner === 'A' ? nameA : nameB;
      const wasServing = winner === state.servingTeam;

      if (winner === 'A') state.scoreA++;
      else state.scoreB++;
      state.isOpeningServe = false;
      if (wasServing) {
        const kL = `${winner}_left`, kR = `${winner}_right`;
        [state.positions[kL], state.positions[kR]] = [state.positions[kR], state.positions[kL]];
      } else {
        state.servingTeam = winner;
        state.serverNumber = 1;
      }
      syncServer(winner);
      const outcomeText = customDetail || (wasServing
        ? `${winName} scored on serve (${state.servingPlayer}, ${ord(state.serverNumber)} server)`
        : `${winName} won rally & side-out point (${state.servingPlayer}, 1st server)`);
      recordRoomEvent('rally', 'WON RALLY', outcomeText);
      checkEnd();
      render();
    }

    function serverLoss(fromFault = false) {
      if (state.gameOver) return;
      history.push(clone());
      const { nameA, nameB } = getNames();
      const prevTeamName = state.servingTeam === 'A' ? nameA : nameB;
      const prevPlayer = state.servingPlayer;
      const prevNum = state.serverNumber;

      if (state.isOpeningServe) {
        state.isOpeningServe = false;
        state.servingTeam = state.servingTeam === 'A' ? 'B' : 'A';
        state.serverNumber = 1;
      } else if (state.serverNumber === 1) {
        state.serverNumber = 2;
      } else {
        state.servingTeam = state.servingTeam === 'A' ? 'B' : 'A';
        state.serverNumber = 1;
      }
      syncServer(state.servingTeam);
      if (!fromFault) {
        const nextTeamName = state.servingTeam === 'A' ? nameA : nameB;
        recordRoomEvent(
          'rally',
          'SERVER CHANGE',
          `${prevTeamName} (${prevPlayer}, ${ord(prevNum)}) lost serve → ${nextTeamName} (${state.servingPlayer}, ${ord(state.serverNumber)})`
        );
      }
      checkEnd();
      render();
    }

    const sideTeam = (side) => (side === 'left' ? (!isCourtSwitched() ? 'A' : 'B') : (!isCourtSwitched() ? 'B' : 'A'));

    function loadMatch(idx) {
      activeMatchIndex = idx;
      const m = teamMatches[idx];
      history = [];
      faultHistory = [];
      state = {
        ...state,
        positions: {
          A_left: m.teamAPlayers[0],
          A_right: m.teamAPlayers[1],
          B_right: m.teamBPlayers[0],
          B_left: m.teamBPlayers[1]
        },
        scoreA: m.scoreA || 0,
        scoreB: m.scoreB || 0,
        gameOver: m.completed || false,
        servingTeam: 'A',
        serverNumber: 1,
        isOpeningServe: true,
        servingPlayer: m.teamAPlayers[1],
        servingSide: 'even',
        endsSwitchedAt8: false,
        manualSwap: false,
        switchBadgeDismissed: false
      };
      const t = parseInt(document.getElementById('select-game-rules').value, 10) || 15;
      state.gameTarget = t;
      state.switchTarget = t === 21 ? 11 : 8;
      document.getElementById('select-active-match').value = idx;
      render();
    }

    // QR Link & Room Matching Sync
    document.getElementById('room-code-text').textContent = viewMode === 'dashboard' ? 'ALL' : roomId;

    function getBaseAppUrl() {
      return PUBLIC_APP_URL
        ? PUBLIC_APP_URL.replace(/\/+$/, '') + '/'
        : window.location.href.split('?')[0];
    }

    function getDisplayShareUrl(targetRoomId = roomId) {
      return `${getBaseAppUrl()}?view=display&room=${encodeURIComponent(targetRoomId)}`;
    }

    function getControlRoomUrl(targetRoomId = roomId) {
      return `${getBaseAppUrl()}?room=${encodeURIComponent(targetRoomId)}`;
    }

    function getDashboardUrl() {
      return `${getBaseAppUrl()}?view=dashboard`;
    }

    function renderRoomQRCode() {
      const box = document.getElementById('qr-code-box');
      const label = document.getElementById('qr-url-label');
      if (!box) return;
      box.innerHTML = '';
      const url = getDisplayShareUrl(roomId);
      if (label) label.textContent = `Room ${roomId} — ${url}`;
      if (typeof QRCode !== 'undefined') {
        try {
          new QRCode(box, { text: url, width: 160, height: 160 });
          return;
        } catch (_) {}
      }
      const img = document.createElement('img');
      img.alt = `Display QR for Room ${roomId}`;
      img.width = 160;
      img.height = 160;
      img.src = `https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=${encodeURIComponent(url)}`;
      box.appendChild(img);
    }

    function applyViewMode(mode) {
      viewMode = mode === 'display' ? 'display' : (mode === 'dashboard' ? 'dashboard' : 'control');
      const isDisplay = viewMode === 'display';
      const isDashboard = viewMode === 'dashboard';
      const wrapper = document.querySelector('.pickleball-app-wrapper');
      wrapper.classList.toggle('display-mode', isDisplay);
      wrapper.classList.toggle('dashboard-mode', isDashboard);
      document.getElementById('room-code-text').textContent = isDashboard ? 'ALL' : roomId;
      document.getElementById('btn-switch-view').textContent = isDisplay ? 'Controller Mode' : 'Display Mode';
      document.getElementById('select-active-match').disabled = isDisplay;
      document.getElementById('select-game-rules').disabled = isDisplay;
      document.getElementById('team-name-A').readOnly = isDisplay;
      document.getElementById('team-name-B').readOnly = isDisplay;
      document.querySelectorAll('.player-input').forEach(el => { el.readOnly = isDisplay; });
      if (isDashboard) renderRoomsDashboard();
      if (isDisplay) requestLatestState();
    }

    function buildRoomSummary() {
      const { nameA, nameB } = getNames();
      const matchObj = teamMatches[activeMatchIndex] || {};
      return {
        type: 'room_summary',
        roomId,
        scoreA: state.scoreA,
        scoreB: state.scoreB,
        servingTeam: state.servingTeam,
        servingPlayer: state.servingPlayer,
        serverNumber: state.serverNumber,
        gameTarget: state.gameTarget,
        gameOver: state.gameOver,
        eventName: matchObj.name || `Game ${activeMatchIndex + 1}`,
        nameA,
        nameB,
        logCount: matchEventLog.length,
        updatedAt: Date.now()
      };
    }

    function upsertRoomSummary(summary) {
      if (!summary || !summary.roomId) return;
      const code = String(summary.roomId).toUpperCase();
      liveRoomsMap.set(code, {
        ...summary,
        roomId: code,
        updatedAt: typeof summary.updatedAt === 'number' ? summary.updatedAt : Date.now()
      });
      if (viewMode === 'dashboard') renderRoomsDashboard();
    }

    function formatAge(ts) {
      const sec = Math.max(0, Math.floor((Date.now() - ts) / 1000));
      if (sec < 5) return 'just now';
      if (sec < 60) return `${sec}s ago`;
      const min = Math.floor(sec / 60);
      return `${min}m ago`;
    }

    function renderRoomsDashboard() {
      const grid = document.getElementById('rooms-grid');
      const countEl = document.getElementById('dashboard-room-count');
      if (!grid || !countEl) return;

      const rooms = Array.from(liveRoomsMap.values()).sort((a, b) => b.updatedAt - a.updatedAt);
      countEl.textContent = `${rooms.length} room${rooms.length === 1 ? '' : 's'} reporting live`;

      if (!rooms.length) {
        grid.innerHTML = `<div class="room-empty-state">Waiting for active referee rooms to broadcast on <b>pickleball-rooms-lobby</b>...<br/>Open a controller room on GitHub Pages and tap a score or wait up to 10s for its heartbeat.</div>`;
        return;
      }

      grid.innerHTML = rooms.map(r => {
        const statusLabel = r.gameOver ? 'FINAL' : 'LIVE';
        const servingLabel = r.gameOver
          ? 'Match Complete'
          : `${r.servingTeam === 'A' ? (r.nameA || 'Team A') : (r.nameB || 'Team B')} · ${r.servingPlayer || ''} (${ord(r.serverNumber || 1)})`;
        return `
          <div class="room-card">
            <div class="room-card-top">
              <span class="room-badge">Room: ${r.roomId}</span>
              <span class="room-meta-pill">${statusLabel} · ${r.gameTarget || 15} pts</span>
            </div>
            <div class="room-event-line">${r.eventName || 'Match'} · ${formatAge(r.updatedAt)} · ${r.logCount ?? 0} logs</div>
            <div class="room-teams-line">
              <span style="color: var(--team-a-score);">${r.nameA || 'Team A'}</span>
              <span style="color: var(--team-b-score);">${r.nameB || 'Team B'}</span>
            </div>
            <div class="room-score-row">
              <span class="room-score-a">${r.scoreA ?? 0}</span>
              <span class="room-score-sep">-</span>
              <span class="room-score-b">${r.scoreB ?? 0}</span>
            </div>
            <div class="room-server-line">
              <span>${servingLabel}</span>
            </div>
            <div class="room-card-actions">
              <a class="room-link-btn" href="${getDisplayShareUrl(r.roomId)}" target="_blank" rel="noopener">Open Display</a>
              <a class="room-link-btn" href="${getControlRoomUrl(r.roomId)}" target="_blank" rel="noopener">Open Control</a>
            </div>
          </div>
        `;
      }).join('');
    }

    function broadcastLobbySummary() {
      if (viewMode !== 'control' || isApplyingRemoteState) return;
      const summary = buildRoomSummary();
      upsertRoomSummary(summary);
      lobbyLocalChannel?.postMessage(summary);
      lobbyChannel?.send({
        type: 'broadcast',
        event: 'room_summary',
        payload: summary
      });
    }

    function buildSnapshot() {
      const { nameA, nameB } = getNames();
      return {
        type: 'score_update',
        roomId,
        state: clone(),
        teamMatches: JSON.parse(JSON.stringify(teamMatches)),
        activeMatchIndex,
        faultHistory: [...faultHistory],
        matchEventLog: matchEventLog.slice(-100),
        teamNameA: nameA,
        teamNameB: nameB
      };
    }

    function applyRemoteSnapshot(payload) {
      if (!payload || String(payload.roomId || '').toUpperCase() !== roomId) return;
      isApplyingRemoteState = true;
      try {
        if (payload.state) state = payload.state;
        if (Array.isArray(payload.teamMatches)) teamMatches = payload.teamMatches;
        if (typeof payload.activeMatchIndex === 'number') activeMatchIndex = payload.activeMatchIndex;
        if (Array.isArray(payload.faultHistory)) faultHistory = payload.faultHistory;
        if (Array.isArray(payload.matchEventLog)) matchEventLog = payload.matchEventLog;
        if (typeof payload.teamNameA === 'string') document.getElementById('team-name-A').value = payload.teamNameA;
        if (typeof payload.teamNameB === 'string') document.getElementById('team-name-B').value = payload.teamNameB;
        render();
      } finally {
        isApplyingRemoteState = false;
      }
    }

    function broadcastSnapshot() {
      if (viewMode !== 'control' || isApplyingRemoteState) return;
      const snap = buildSnapshot();
      localChannel?.postMessage(snap);
      realtimeChannel?.send({
        type: 'broadcast',
        event: 'score_update',
        payload: snap
      });
      broadcastLobbySummary();
    }

    function requestLatestState() {
      if (viewMode !== 'display') return;
      const req = { type: 'request_state', roomId };
      localChannel?.postMessage(req);
      realtimeChannel?.send({
        type: 'broadcast',
        event: 'request_state',
        payload: req
      });
    }

    function startRoomHeartbeat() {
      if (heartbeatTimer) clearInterval(heartbeatTimer);
      heartbeatTimer = setInterval(() => {
        if (viewMode === 'control') broadcastLobbySummary();
        else if (viewMode === 'dashboard') renderRoomsDashboard();
      }, 10000);
    }

    function initRealtimeSync() {
      if (localChannel) {
        localChannel.onmessage = (e) => {
          const d = e.data;
          if (!d || String(d.roomId || '').toUpperCase() !== roomId) return;
          if (d.type === 'request_state' && viewMode === 'control') broadcastSnapshot();
          else if (viewMode === 'display' && d.type === 'score_update') applyRemoteSnapshot(d);
        };
      }
      if (lobbyLocalChannel) {
        lobbyLocalChannel.onmessage = (e) => {
          const d = e.data;
          if (d && d.type === 'room_summary') upsertRoomSummary(d);
        };
      }
      if (!window.supabase || !SUPABASE_CONFIG.url || !SUPABASE_CONFIG.anonKey) {
        document.getElementById('sync-status-label').textContent = 'Local Tab Sync';
        return;
      }
      const client = window.supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.anonKey);

      lobbyChannel = client.channel('pickleball-rooms-lobby', {
        config: { broadcast: { self: false } }
      });
      lobbyChannel
        .on('broadcast', { event: 'room_summary' }, ({ payload }) => {
          upsertRoomSummary(payload);
        })
        .subscribe((status) => {
          if (status === 'SUBSCRIBED' && viewMode === 'control') {
            broadcastLobbySummary();
          }
        });

      if (viewMode !== 'dashboard') {
        realtimeChannel = client.channel(`pickleball-room-${roomId}`, {
          config: { broadcast: { self: false, ack: true } }
        });
        realtimeChannel
          .on('broadcast', { event: 'score_update' }, ({ payload }) => {
            if (viewMode === 'display') applyRemoteSnapshot(payload);
          })
          .on('broadcast', { event: 'request_state' }, ({ payload }) => {
            if (viewMode === 'control' && payload && String(payload.roomId || '').toUpperCase() === roomId) {
              broadcastSnapshot();
            }
          })
          .subscribe((status) => {
            const live = status === 'SUBSCRIBED';
            document.getElementById('sync-dot').classList.toggle('live', live);
            document.getElementById('sync-status-label').textContent = live ? 'Live Cloud' : status;
            if (!live) return;
            if (viewMode === 'control') {
              broadcastSnapshot();
              broadcastLobbySummary();
            } else if (viewMode === 'display') {
              requestLatestState();
              setTimeout(requestLatestState, 400);
            }
          });
      } else {
        document.getElementById('sync-dot').classList.add('live');
        document.getElementById('sync-status-label').textContent = 'Live Lobby';
      }
    }

    // Events
    document.getElementById('btn-export-csv').addEventListener('click', exportRoomLogCsv);
    document.getElementById('btn-export-json').addEventListener('click', exportRoomLogJson);
    document.getElementById('btn-clear-room-log').addEventListener('click', () => {
      matchEventLog = [];
      saveStoredRoomLog();
      renderRoomEventLog();
      broadcastSnapshot();
    });
    document.getElementById('btn-open-dashboard').addEventListener('click', () => {
      window.open(getDashboardUrl(), '_blank', 'noopener');
    });
    document.getElementById('btn-dashboard-back').addEventListener('click', () => {
      applyViewMode('control');
    });
    document.getElementById('btn-dashboard-prune').addEventListener('click', () => {
      const cutoff = Date.now() - 5 * 60 * 1000;
      for (const [k, v] of liveRoomsMap.entries()) {
        if ((v.updatedAt || 0) < cutoff) liveRoomsMap.delete(k);
      }
      renderRoomsDashboard();
    });
    document.getElementById('btn-toggle-qr').addEventListener('click', () => {
      const pop = document.getElementById('qr-popover');
      const open = pop.style.display === 'none';
      pop.style.display = open ? 'block' : 'none';
      if (open) renderRoomQRCode();
    });
    document.getElementById('btn-switch-view').addEventListener('click', () => {
      applyViewMode(viewMode === 'display' ? 'control' : 'display');
    });
    document.getElementById('btn-fullscreen').addEventListener('click', async () => {
      const w = document.querySelector('.pickleball-app-wrapper');
      try {
        if (!document.fullscreenElement) await w.requestFullscreen();
        else await document.exitFullscreen();
      } catch (_) {
        w.classList.toggle('display-mode');
      }
    });
    document.getElementById('btn-win-A').addEventListener('click', () => awardPoint(sideTeam('left')));
    document.getElementById('btn-win-B').addEventListener('click', () => awardPoint(sideTeam('right')));
    document.getElementById('btn-swap-court-ccw2').addEventListener('click', swapCourtCCW2);
    document.getElementById('btn-undo').addEventListener('click', () => {
      if (!history.length) return;
      state = history.pop();
      const m = teamMatches[activeMatchIndex];
      if (m.completed && !state.gameOver) {
        m.completed = false;
        m.winner = null;
      }
      recordRoomEvent('system', 'UNDO', `Reverted to ${state.scoreA}-${state.scoreB}`);
      render();
    });
    document.getElementById('btn-reset').addEventListener('click', () => {
      Object.assign(teamMatches[activeMatchIndex], { scoreA: 0, scoreB: 0, completed: false, winner: null });
      recordRoomEvent('system', 'RESET GAME', `Reset Game ${activeMatchIndex + 1} to 0-0`);
      loadMatch(activeMatchIndex);
    });
    ['left', 'right'].forEach(side => {
      document.getElementById(side === 'left' ? 'btn-fault-A' : 'btn-fault-B').addEventListener('click', () => {
        if (state.gameOver) return;
        const t = sideTeam(side);
        const { nameA, nameB } = getNames();
        const offenderTeam = t === 'A' ? nameA : nameB;
        const offenderRole = t === state.servingTeam ? `${state.servingPlayer} (${ord(state.serverNumber)})` : 'RECEIVER';
        const msg = `${offenderTeam} (${offenderRole}) - Foot Fault at ${state.scoreA}-${state.scoreB}`;
        faultHistory.push(msg);
        recordRoomEvent('fault', 'FOOT FAULT', msg);
        if (t === state.servingTeam) {
          serverLoss(true);
        } else {
          const winnerTeam = t === 'A' ? 'B' : 'A';
          const winnerName = winnerTeam === 'A' ? nameA : nameB;
          awardPoint(winnerTeam, `${winnerName} awarded point from ${offenderTeam} Foot Fault`);
        }
      });
      document.getElementById(`btn-handicap-${side}`).addEventListener('click', () => {
        if (state.gameOver) return;
        const t = sideTeam(side);
        const { nameA, nameB } = getNames();
        history.push(clone());
        if (t === 'A') state.scoreA++;
        else state.scoreB++;
        syncServer(t);
        recordRoomEvent('rally', 'HANDICAP +1', `+1 Handicap point awarded to ${t === 'A' ? nameA : nameB}`);
        checkEnd();
        render();
      });
    });
    document.getElementById('btn-fault-serve').addEventListener('click', () => {
      if (state.gameOver) return;
      const { nameA, nameB } = getNames();
      const msg = `${state.servingTeam === 'A' ? nameA : nameB} (${state.servingPlayer} (${ord(state.serverNumber)})) - Serve Fault at ${state.scoreA}-${state.scoreB}`;
      faultHistory.push(msg);
      recordRoomEvent('fault', 'SERVE FAULT', msg);
      serverLoss(true);
    });
    document.getElementById('select-game-rules').addEventListener('change', (e) => {
      const t = parseInt(e.target.value, 10);
      state.gameTarget = t;
      state.switchTarget = t === 21 ? 11 : 8;
      recordRoomEvent('system', 'RULE CHANGE', `Game target set to ${t} points`);
      checkEnd();
      render();
    });
    document.getElementById('select-active-match').addEventListener('change', (e) => {
      const nextIdx = parseInt(e.target.value, 10);
      recordRoomEvent('system', 'SWITCH GAME', `Switched to Game ${nextIdx + 1}`);
      loadMatch(nextIdx);
    });
    document.getElementById('team-name-A').addEventListener('input', render);
    document.getElementById('team-name-B').addEventListener('input', render);
    ['A', 'B'].forEach(t => {
      document.getElementById(`toggle-serve-${t}`).addEventListener('click', () => {
        setStartingServer(t);
        render();
      });
    });
    document.querySelectorAll('.player-input').forEach(inp => {
      inp.addEventListener('click', (e) => e.stopPropagation());
      inp.addEventListener('input', (e) => {
        e.target.value = e.target.value.toUpperCase().slice(0, 3);
        updateCourtNames();
        updateHud();
        highlightServer();
        broadcastSnapshot();
      });
      inp.addEventListener('change', (e) => {
        e.target.value = e.target.value.toUpperCase().slice(0, 3);
        updateCourtNames();
        render();
      });
    });
    document.querySelectorAll('.pickleball-app-wrapper .player-node').forEach(node => {
      node.addEventListener('click', () => {
        if (viewMode === 'display') return;
        const t = node.id.includes('-A-') ? 'A' : (node.id.includes('-B-') ? 'B' : null);
        if (t) {
          setStartingServer(t);
          render();
        }
      });
    });

    applyViewMode(viewMode);
    initRealtimeSync();
    startRoomHeartbeat();
    loadMatch(0);
  </script>
</body>
</html>
