<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pickleball 100-Pt Relay Scoreboard</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --bg-dark: #121212;
      --panel-bg: #1e1e1e;
      --court-bg: #2a2a2a;
      --kitchen-blue: #0d47a1;
      --team-a-score: #2e7d32;
      --team-b-score: #e91e63;
      --accent-gold: #ffb300;
      --text-main: #f5f5f5;
      --text-dim: #aaaaaa;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 12px;
      background: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .scoreboard-app {
      max-width: 480px;
      margin: 0 auto;
      background: var(--panel-bg);
      border-radius: 14px;
      padding: 12px;
      border: 1px solid #333;
    }
    .room-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid #333;
      font-size: 0.8rem;
    }
    .room-info { display: flex; align-items: center; gap: 6px; }
    .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: #777; display: inline-block; }
    .sync-dot.live { background: #4caf50; box-shadow: 0 0 6px #4caf50; }
    .sync-label { color: var(--text-dim); font-size: 0.72rem; }
    .btn-chip {
      background: #2c2c2c;
      color: #fff;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
    }
    .qr-popover {
      margin-top: 8px;
      padding: 10px;
      background: #161616;
      border: 1px solid #3a3a3a;
      border-radius: 8px;
      text-align: center;
    }
    .qr-popover img, .qr-popover canvas { background: #fff; padding: 6px; border-radius: 6px; }
    .qr-url { margin-top: 6px; font-size: 0.7rem; color: var(--text-dim); word-break: break-all; }
    .top-controls { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
    .team-name-row { display: flex; align-items: center; gap: 8px; }
    .team-name-input {
      flex: 1;
      background: #151515;
      border: 1px solid #3a3a3a;
      border-radius: 8px;
      padding: 6px 8px;
      color: #fff;
      font-weight: 700;
      text-align: center;
    }
    .team-name-input.team-a { border-color: var(--team-a-score); }
    .team-name-input.team-b { border-color: var(--team-b-score); }
    .vs-label { color: var(--text-dim); font-size: 0.75rem; font-weight: 700; }
    .select-row { display: flex; gap: 6px; }
    .control-select {
      flex: 1;
      background: #252525;
      color: #fff;
      border: 1px solid #3c3c3c;
      border-radius: 8px;
      padding: 6px 8px;
      font-size: 0.78rem;
    }
    .serve-banner {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 8px;
      font-size: 0.78rem;
    }
    .team-pill { padding: 3px 9px; border-radius: 999px; font-weight: 800; font-size: 0.72rem; }
    .status-line { text-align: center; margin-top: 6px; font-size: 0.75rem; font-weight: 700; color: var(--text-dim); }
    .score-display {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      margin: 6px 0;
    }
    .big-score { font-size: 3.4rem; font-weight: 900; line-height: 1; }
    .score-sep { font-size: 2rem; color: #666; font-weight: 700; }
    .server-toggle-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      color: var(--text-dim);
      margin-bottom: 8px;
    }
    .mini-toggle {
      border: 1px solid #444;
      border-radius: 6px;
      padding: 3px 10px;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
    }
    .handicap-row, .primary-actions, .fault-actions { display: flex; gap: 8px; margin-bottom: 8px; }
    .btn-action, .btn-rally, .btn-fault, .btn-util {
      flex: 1;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-weight: 800;
      cursor: pointer;
    }
    .btn-action { padding: 8px; font-size: 0.78rem; }
    .btn-rally { padding: 13px 10px; font-size: 0.92rem; }
    .utility-actions { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
    .btn-util { background: #333; padding: 9px; font-size: 0.82rem; border: 1px solid #444; }
    .btn-fault { padding: 9px 6px; font-size: 0.75rem; }
    .btn-serve-fault { background: var(--accent-gold); color: #111; }
    .court-wrapper {
      display: grid;
      grid-template-columns: 1fr 56px 1fr;
      background: var(--court-bg);
      border: 2px solid #fff;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 10px;
    }
    .court-side {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 8px;
      gap: 10px;
    }
    .baseline-label {
      align-self: center;
      background: var(--accent-gold);
      color: #111;
      font-weight: 900;
      font-size: 0.75rem;
      padding: 2px 10px;
      border-radius: 999px;
    }
    .player-node {
      border: 2px solid #444;
      border-radius: 999px;
      padding: 6px 8px;
      text-align: center;
      background: #1b1b1b;
      cursor: pointer;
    }
    .left-side .player-node { border-color: var(--team-a-score); }
    .right-side .player-node { border-color: var(--team-b-score); }
    .player-node.serving {
      border-color: var(--accent-gold) !important;
      box-shadow: 0 0 12px rgba(255, 179, 0, 0.65);
    }
    .player-input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid #555;
      color: #fff;
      font-weight: 800;
      font-size: 0.85rem;
      text-align: center;
      outline: none;
    }
    .server-indicator {
      display: block;
      margin-top: 2px;
      font-size: 0.62rem;
      font-weight: 900;
      color: var(--accent-gold);
      text-transform: uppercase;
    }
    .kitchen-zone {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--kitchen-blue);
      border-left: 2px solid #fff;
      border-right: 2px solid #fff;
    }
    .kitchen-half {
      display: flex;
      align-items: center;
      justify-content: center;
      border-right: 1px solid rgba(255, 255, 255, 0.35);
    }
    .kitchen-half:last-child { border-right: none; }
    .kitchen-half span {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      font-size: 0.65rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: rgba(255, 255, 255, 0.85);
    }
    .fault-log {
      max-height: 74px;
      overflow-y: auto;
      background: #161616;
      border-radius: 8px;
      padding: 6px 8px;
      margin-bottom: 8px;
      font-size: 0.72rem;
      color: #ccc;
    }
    .fault-log:empty { display: none; }
    .fault-log-entry { padding: 2px 0; border-bottom: 1px solid #262626; }
    .summary-card {
      background: #171717;
      border: 1px solid #303030;
      border-radius: 10px;
      padding: 10px;
    }
    .summary-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      font-weight: 900;
      color: var(--accent-gold);
      margin-bottom: 6px;
    }
    .summary-list { display: flex; flex-direction: column; gap: 4px; font-size: 0.76rem; }

    body.display-mode .handicap-row,
    body.display-mode .primary-actions,
    body.display-mode .utility-actions,
    body.display-mode .fault-actions,
    body.display-mode .server-toggle-row,
    body.display-mode .select-row,
    body.display-mode #btn-toggle-qr {
      display: none !important;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 16px;
    }
    .modal-backdrop.open { display: flex; }
    .modal-card {
      background: #1f1f1f;
      border: 2px solid var(--accent-gold);
      border-radius: 14px;
      padding: 18px;
      max-width: 340px;
      width: 100%;
      text-align: center;
    }
    .modal-badge {
      display: inline-block;
      background: var(--accent-gold);
      color: #111;
      font-weight: 900;
      font-size: 0.72rem;
      padding: 3px 10px;
      border-radius: 999px;
    }
    .modal-lineup { margin: 12px 0; font-size: 0.9rem; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="scoreboard-app">
    <div class="room-bar">
      <div class="room-info">
        <span class="sync-dot" id="sync-dot"></span>
        <span>Room: <strong id="room-code-text">----</strong></span>
        <span class="sync-label" id="sync-status-label">Connecting...</span>
      </div>
      <div class="room-actions">
        <button type="button" class="btn-chip" id="btn-toggle-qr">QR Viewer</button>
      </div>
    </div>

    <div class="qr-popover" id="qr-popover" style="display:none;">
      <div id="qr-code-box"></div>
      <div class="qr-url" id="qr-url-label"></div>
    </div>

    <div class="top-controls">
      <div class="team-name-row">
        <input type="text" id="team-name-A" class="team-name-input team-a" value="Team A" maxlength="12" />
        <span class="vs-label">VS</span>
        <input type="text" id="team-name-B" class="team-name-input team-b" value="Team B" maxlength="12" />
      </div>
      <div class="select-row">
        <select id="select-active-match" class="control-select">
          <option value="0">0–20 女雙</option>
          <option value="1">20–40 混雙</option>
          <option value="2">40–60 混雙</option>
          <option value="3">60–80 混雙</option>
          <option value="4">80–100 男雙</option>
        </select>
        <select id="select-game-rules" class="control-select">
          <option value="100" selected>100 Pts Relay (Rotate @ 20/40/60/80)</option>
          <option value="20">Test 20 Pts Match</option>
        </select>
      </div>
    </div>

    <div class="serve-banner">
      <span class="team-pill" id="banner-team-pill">Team A SERVING</span>
      <span id="banner-server-player">Server: W2 (1st)</span>
      <span id="banner-court-side">0–20 女雙 · EVEN (Right)</span>
    </div>

    <div class="status-line" id="status-display">Active: 0–20 女雙 · Target 100</div>

    <div class="score-display">
      <span id="score-left" class="big-score">0</span>
      <span class="score-sep">-</span>
      <span id="score-right" class="big-score">0</span>
    </div>

    <div class="server-toggle-row">
      <span>Starting Server:</span>
      <button type="button" id="toggle-serve-A" class="mini-toggle">Team A</button>
      <button type="button" id="toggle-serve-B" class="mini-toggle">Team B</button>
    </div>

    <div class="handicap-row">
      <button type="button" id="btn-handicap-left" class="btn-action">+1 Handicap Team A</button>
      <button type="button" id="btn-handicap-right" class="btn-action">+1 Handicap Team B</button>
    </div>

    <div class="court-wrapper">
      <div class="court-side left-side">
        <div class="baseline-label" id="baseline-label-left">Team A</div>
        <div class="player-node" id="p-A-left">
          <input type="text" id="input-A-left" class="player-input" value="W1" maxlength="3" />
        </div>
        <div class="player-node" id="p-A-right">
          <input type="text" id="input-A-right" class="player-input" value="W2" maxlength="3" />
        </div>
      </div>

      <div class="kitchen-zone">
        <div class="kitchen-half"><span>KITCHEN</span></div>
        <div class="kitchen-half"><span>KITCHEN</span></div>
      </div>

      <div class="court-side right-side">
        <div class="baseline-label" id="baseline-label-right">Team B</div>
        <div class="player-node" id="p-B-left">
          <input type="text" id="input-B-left" class="player-input" value="W4" maxlength="3" />
        </div>
        <div class="player-node" id="p-B-right">
          <input type="text" id="input-B-right" class="player-input" value="W3" maxlength="3" />
        </div>
      </div>
    </div>

    <div class="primary-actions">
      <button type="button" id="btn-win-A" class="btn-rally">Team A Won Rally</button>
      <button type="button" id="btn-win-B" class="btn-rally">Team B Won Rally</button>
    </div>

    <div class="utility-actions">
      <button type="button" id="btn-swap-court-ccw2" class="btn-util">Swap Court (CCW 2 Moves)</button>
      <button type="button" id="btn-undo" class="btn-util">Undo Last Move</button>
      <button type="button" id="btn-reset" class="btn-util">Reset Match</button>
    </div>

    <div class="fault-actions">
      <button type="button" id="btn-fault-A" class="btn-fault">Team A Foot Fault</button>
      <button type="button" id="btn-fault-serve" class="btn-fault btn-serve-fault">Serve Fault</button>
      <button type="button" id="btn-fault-B" class="btn-fault">Team B Foot Fault</button>
    </div>

    <div class="fault-log" id="fault-log"></div>

    <div class="summary-card">
      <div class="summary-header">
        <span>100-POINT RELAY SEGMENTS</span>
        <span>Total: <b id="event-score-A">0</b> - <b id="event-score-B">0</b></span>
      </div>
      <div id="match-summary-log" class="summary-list"></div>
    </div>
  </div>

  <div class="modal-backdrop" id="court-switch-modal">
    <div class="modal-card">
      <div class="modal-badge">COURT SWITCH</div>
      <h3 id="court-switch-title">Players Changed</h3>
      <div id="court-switch-lineup" class="modal-lineup"></div>
      <button type="button" id="btn-dismiss-court-switch" class="btn-rally" style="background:#ffb300;color:#111;width:100%;">OK / Continue</button>
    </div>
  </div>

  <script>
    const PUBLIC_APP_URL = 'https://pickleballlog.github.io/pickleball-scoreboard/relay.html';
    const SUPABASE_CONFIG = {
      url: 'https://bfdqwreulrfsulvdrlzk.supabase.co',
      anonKey: 'sb_publishable_Vo2M8B6ptaLBPbtGK557aw_vTXFoqoF'
    };

    const RELAY_SEGMENTS = [
      { min: 0, max: 20, label: '女雙', rangeLabel: '0–20' },
      { min: 20, max: 40, label: '混雙', rangeLabel: '20–40' },
      { min: 40, max: 60, label: '混雙', rangeLabel: '40–60' },
      { min: 60, max: 80, label: '混雙', rangeLabel: '60–80' },
      { min: 80, max: 100, label: '男雙', rangeLabel: '80–100' }
    ];

    const urlParams = new URLSearchParams(window.location.search);
    const savedRoom = typeof sessionStorage !== 'undefined' ? sessionStorage.getItem('pb_relay_room') : null;
    const roomId = (urlParams.get('room') || savedRoom || Math.random().toString(36).substring(2, 6)).toUpperCase();
    if (typeof sessionStorage !== 'undefined') sessionStorage.setItem('pb_relay_room', roomId);

    let viewMode = urlParams.get('view') === 'display' ? 'display' : 'control';
    let isApplyingRemoteState = false;
    let realtimeChannel = null;
    const localChannel = typeof BroadcastChannel !== 'undefined' ? new BroadcastChannel(`pb-relay-${roomId}`) : null;

    let history = [];
    let faultHistory = [];
    let activeSegmentIndex = 0;
    let segmentWinners = [null, null, null, null, null];

    let segmentRosters = [
      { A_left: 'W1', A_right: 'W2', B_right: 'W3', B_left: 'W4' },
      { A_left: 'M1', A_right: 'W5', B_right: 'M2', B_left: 'W6' },
      { A_left: 'M3', A_right: 'W7', B_right: 'M4', B_left: 'W8' },
      { A_left: 'M5', A_right: 'W9', B_right: 'M6', B_left: 'W10' },
      { A_left: 'M7', A_right: 'M8', B_right: 'M9', B_left: 'M10' }
    ];

    let state = {
      scoreA: 0,
      scoreB: 0,
      gameTarget: 100,
      gameOver: false,
      servingTeam: 'A',
      serverNumber: 1,
      isOpeningServe: true,
      servingPlayer: 'W2',
      servingSide: 'even',
      positions: { A_left: 'W1', A_right: 'W2', B_left: 'W4', B_right: 'W3' },
      manualSwap: false
    };

    const clone = (obj) => JSON.parse(JSON.stringify(obj));
    const isCourtSwitched = () => Boolean(state.manualSwap);
    const ord = (n) => (n === 1 ? '1st' : '2nd');
    const getTeamNames = () => ({
      nameA: document.getElementById('team-name-A').value,
      nameB: document.getElementById('team-name-B').value
    });

    const getMilestoneSeg = (a, b) => {
      const top = Math.max(a, b);
      return top >= 80 ? 4 : top >= 60 ? 3 : top >= 40 ? 2 : top >= 20 ? 1 : 0;
    };

    const pushHistorySnapshot = () => {
      history.push({
        state: clone(state),
        rosters: clone(segmentRosters),
        winners: clone(segmentWinners),
        seg: activeSegmentIndex
      });
    };

    const saveSegRoster = (idx = activeSegmentIndex) => {
      segmentRosters[idx] = {
        A_left: state.positions.A_left,
        A_right: state.positions.A_right,
        B_right: state.positions.B_right,
        B_left: state.positions.B_left
      };
    };

    function showCourtSwitchPopup(segIdx, reasonText = 'Players Changed') {
      const seg = RELAY_SEGMENTS[segIdx];
      const r = segmentRosters[segIdx];
      const { nameA, nameB } = getTeamNames();
      document.getElementById('court-switch-title').textContent = `${reasonText} · ${seg.rangeLabel} ${seg.label}`;
      document.getElementById('court-switch-lineup').innerHTML =
        `<div><b>${nameA}:</b> ${r.A_left} / ${r.A_right}</div>` +
        `<div><b>${nameB}:</b> ${r.B_right} / ${r.B_left}</div>`;
      document.getElementById('court-switch-modal').classList.add('open');
    }

    function hideCourtSwitchPopup() {
      document.getElementById('court-switch-modal').classList.remove('open');
    }

    function applySegRoster(idx, notifySwitch = false, reasonText = 'Players Changed') {
      const r = segmentRosters[idx];
      if (!r) return;
      state.positions = { A_left: r.A_left, A_right: r.A_right, B_right: r.B_right, B_left: r.B_left };
      activeSegmentIndex = idx;
      document.getElementById('select-active-match').value = String(idx);
      refreshServerState(state.servingTeam);
      if (notifySwitch && !isApplyingRemoteState) showCourtSwitchPopup(idx, reasonText);
    }

    const getServerForTeam = (team) => {
      const odd = (team === 'A' ? state.scoreA : state.scoreB) % 2 === 1;
      return team === 'A'
        ? (odd ? state.positions.A_left : state.positions.A_right)
        : (odd ? state.positions.B_left : state.positions.B_right);
    };

    const refreshServerState = (team = state.servingTeam) => {
      const odd = (team === 'A' ? state.scoreA : state.scoreB) % 2 === 1;
      state.servingPlayer = getServerForTeam(team);
      state.servingSide = odd ? 'odd' : 'even';
    };

    const resolveSideTeam = (side) => (!isCourtSwitched() ? (side === 'left' ? 'A' : 'B') : (side === 'left' ? 'B' : 'A'));

    function readCourtInputs() {
      const fb = segmentRosters[activeSegmentIndex];
      const read = (id, def) => ((document.getElementById(id).value || '').toUpperCase().slice(0, 3)) || def;
      return {
        leftTop: read('input-A-left', !isCourtSwitched() ? fb.A_left : fb.B_left),
        leftBottom: read('input-A-right', !isCourtSwitched() ? fb.A_right : fb.B_right),
        rightTop: read('input-B-left', !isCourtSwitched() ? fb.B_left : fb.A_left),
        rightBottom: read('input-B-right', !isCourtSwitched() ? fb.B_right : fb.A_right)
      };
    }

    function updateCourtNamesFromInputs() {
      const { leftTop, leftBottom, rightTop, rightBottom } = readCourtInputs();
      const prev = Object.assign({}, state.positions);
      state.positions = !isCourtSwitched()
        ? { A_left: leftTop, A_right: leftBottom, B_left: rightTop, B_right: rightBottom }
        : { B_left: leftTop, B_right: leftBottom, A_left: rightTop, A_right: rightBottom };
      saveSegRoster(activeSegmentIndex);
      const map = { [prev.A_left]: state.positions.A_left, [prev.A_right]: state.positions.A_right, [prev.B_right]: state.positions.B_right, [prev.B_left]: state.positions.B_left };
      state.servingPlayer = Object.prototype.hasOwnProperty.call(map, state.servingPlayer) ? map[state.servingPlayer] : getServerForTeam(state.servingTeam);
    }

    function swapCourtPlayersCCW2() {
      if (state.gameOver) return;
      pushHistorySnapshot();
      const { leftTop, leftBottom, rightTop, rightBottom } = readCourtInputs();
      const prev = Object.assign({}, state.positions);
      state.positions = !isCourtSwitched()
        ? { A_left: rightTop, A_right: rightBottom, B_left: leftTop, B_right: leftBottom }
        : { B_left: rightTop, B_right: rightBottom, A_left: leftTop, A_right: leftBottom };
      saveSegRoster(activeSegmentIndex);
      const map = { [prev.A_left]: state.positions.A_left, [prev.A_right]: state.positions.A_right, [prev.B_right]: state.positions.B_right, [prev.B_left]: state.positions.B_left };
      state.servingPlayer = Object.prototype.hasOwnProperty.call(map, state.servingPlayer) ? map[state.servingPlayer] : getServerForTeam(state.servingTeam);
      showCourtSwitchPopup(activeSegmentIndex, 'Player Rotation (CCW 2)');
      render();
    }

    function render() {
      if (!document.activeElement || !document.activeElement.classList.contains('player-input')) {
        const { A_left, A_right, B_left, B_right } = state.positions;
        const vals = !isCourtSwitched() ? [A_left, A_right, B_left, B_right] : [B_left, B_right, A_left, A_right];
        ['input-A-left', 'input-A-right', 'input-B-left', 'input-B-right'].forEach((id, i) => { document.getElementById(id).value = vals[i]; });
      }

      const { nameA, nameB } = getTeamNames();
      const seg = RELAY_SEGMENTS[activeSegmentIndex];
      const odd = state.servingSide === 'odd';

      const pill = document.getElementById('banner-team-pill');
      pill.textContent = state.gameOver ? 'GAME OVER' : `${state.servingTeam === 'A' ? nameA : nameB} SERVING`;
      pill.style.background = state.servingTeam === 'A' ? 'var(--team-a-score)' : 'var(--team-b-score)';
      pill.style.color = '#ffffff';
      document.getElementById('banner-server-player').textContent = `Server: ${state.servingPlayer} (${ord(state.serverNumber)})`;
      document.getElementById('banner-court-side').textContent = `${seg.rangeLabel} ${seg.label} · ${odd ? 'ODD (Left)' : 'EVEN (Right)'}`;

      document.querySelectorAll('.player-node').forEach((node) => {
        node.classList.remove('serving');
        node.querySelector('.server-indicator')?.remove();
      });
      if (!Object.values(state.positions).includes(state.servingPlayer)) state.servingPlayer = getServerForTeam(state.servingTeam);
      const sw = isCourtSwitched();
      let nodeId = null;
      if (state.servingTeam === 'A') {
        if (state.positions.A_left === state.servingPlayer) nodeId = !sw ? 'p-A-left' : 'p-B-left';
        if (state.positions.A_right === state.servingPlayer) nodeId = !sw ? 'p-A-right' : 'p-B-right';
      } else {
        if (state.positions.B_left === state.servingPlayer) nodeId = !sw ? 'p-B-left' : 'p-A-left';
        if (state.positions.B_right === state.servingPlayer) nodeId = !sw ? 'p-B-right' : 'p-A-right';
      }
      const sNode = nodeId && document.getElementById(nodeId);
      if (sNode) {
        sNode.classList.add('serving');
        const b = document.createElement('span');
        b.className = 'server-indicator';
        b.textContent = `${ord(state.serverNumber)} Server`;
        sNode.appendChild(b);
      }

      const winnerName = state.scoreA >= state.scoreB ? nameA : nameB;
      const stEl = document.getElementById('status-display');
      if (state.gameOver) {
        stEl.textContent = `${winnerName} Wins 100-Pt Relay! Final: ${state.scoreA}-${state.scoreB}`;
        stEl.style.color = 'var(--accent-gold)';
      } else {
        stEl.textContent = `Active: ${seg.rangeLabel} ${seg.label} · Target ${state.gameTarget}`;
        stEl.style.color = 'var(--text-dim)';
      }

      const servA = state.servingTeam === 'A';
      const lEl = document.getElementById('score-left');
      const rEl = document.getElementById('score-right');
      lEl.textContent = servA ? state.scoreA : state.scoreB;
      rEl.textContent = servA ? state.scoreB : state.scoreA;
      lEl.style.color = servA ? 'var(--team-a-score)' : 'var(--team-b-score)';
      rEl.style.color = servA ? 'var(--team-b-score)' : 'var(--team-a-score)';

      const fLog = document.getElementById('fault-log');
      fLog.innerHTML = faultHistory.slice(-10).map((e) => `<div class="fault-log-entry">${e}</div>`).join('');
      fLog.scrollTop = fLog.scrollHeight;

      document.getElementById('baseline-label-left').textContent = !sw ? nameA : nameB;
      document.getElementById('baseline-label-right').textContent = !sw ? nameB : nameA;

      const leftIsA = !sw;
      const setBtn = (id, text, bg) => { const el = document.getElementById(id); el.textContent = text; el.style.backgroundColor = bg; };
      setBtn('btn-win-A', `${leftIsA ? nameA : nameB} Won Rally`, leftIsA ? '#2e7d32' : 'var(--team-b-score)');
      setBtn('btn-win-B', `${leftIsA ? nameB : nameA} Won Rally`, leftIsA ? 'var(--team-b-score)' : '#2e7d32');
      setBtn('btn-fault-A', `${leftIsA ? nameA : nameB} Foot Fault`, leftIsA ? '#2e7d32' : 'var(--team-b-score)');
      setBtn('btn-fault-B', `${leftIsA ? nameB : nameA} Foot Fault`, leftIsA ? 'var(--team-b-score)' : '#2e7d32');
      setBtn('btn-handicap-left', `+1 Handicap ${leftIsA ? nameA : nameB}`, leftIsA ? '#2e7d32' : 'var(--team-b-score)');
      setBtn('btn-handicap-right', `+1 Handicap ${leftIsA ? nameB : nameA}`, leftIsA ? 'var(--team-b-score)' : '#2e7d32');

      const tA = document.getElementById('toggle-serve-A');
      const tB = document.getElementById('toggle-serve-B');
      tA.textContent = nameA;
      tB.textContent = nameB;
      tA.style.background = state.servingTeam === 'A' ? 'var(--team-a-score)' : 'transparent';
      tA.style.color = state.servingTeam === 'A' ? '#fff' : '#aaa';
      tB.style.background = state.servingTeam === 'B' ? 'var(--team-b-score)' : 'transparent';
      tB.style.color = state.servingTeam === 'B' ? '#fff' : '#aaa';

      const lead = Math.max(state.scoreA, state.scoreB);
      const hasWinner = state.gameOver || state.scoreA >= state.gameTarget || state.scoreB >= state.gameTarget;
      const whoWon = state.scoreA > state.scoreB ? nameA : (state.scoreB > state.scoreA ? nameB : 'Tie');
      const winnerColor = state.scoreA >= state.scoreB ? 'var(--team-a-score)' : 'var(--team-b-score)';

      const winnerBanner = hasWinner
        ? `<div id="log-game-winner" style="padding:8px 10px;margin-bottom:6px;border-radius:6px;background:rgba(255,179,0,0.14);border:1px solid var(--accent-gold);color:#fff;font-weight:800;">🏆 WINNER: <span style="color:${winnerColor};">${whoWon}</span> · Final Score: ${state.scoreA}–${state.scoreB}</div>`
        : '';

      document.getElementById('match-summary-log').innerHTML =
        winnerBanner +
        RELAY_SEGMENTS.map((s, idx) => {
          const r = segmentRosters[idx];
          const winInfo = segmentWinners[idx];
          const isAct = !hasWinner && idx === activeSegmentIndex;
          const isDone = Boolean(winInfo) || (hasWinner ? (lead >= s.max || idx <= activeSegmentIndex) : (lead >= s.max));
          const reachBadge = winInfo
            ? `<span style="color:${winInfo.team === 'A' ? 'var(--team-a-score)' : 'var(--team-b-score)'};font-weight:bold;">1st to ${s.max}: ${winInfo.name} (${winInfo.scoreA}-${winInfo.scoreB})</span>`
            : (isAct
              ? `<span style="color:var(--accent-gold);font-weight:bold;">Active</span>`
              : (isDone ? `<span style="color:#81c784;">Reached</span>` : `<span>Upcoming</span>`));

          return `<div style="padding:4px 6px;border-radius:4px;background:${isAct ? '#2d2d2d' : 'transparent'};border-left:${isAct ? '3px solid var(--accent-gold)' : 'none'};"><b>${s.rangeLabel} ${s.label}:</b> ${reachBadge} · <span style="color:#bbb;">A: ${r.A_left}/${r.A_right} | B: ${r.B_right}/${r.B_left}</span></div>`;
        }).join('');

      document.getElementById('event-score-A').textContent = state.scoreA;
      document.getElementById('event-score-B').textContent = state.scoreB;
      document.getElementById('select-game-rules').value = state.gameTarget;
      broadcastSnapshot();
    }

    function checkMilestoneAndGameOver() {
      const { nameA, nameB } = getTeamNames();
      RELAY_SEGMENTS.forEach((s, idx) => {
        if (!segmentWinners[idx] && (state.scoreA >= s.max || state.scoreB >= s.max)) {
          const reachedTeam = state.scoreA >= s.max && state.scoreB >= s.max
            ? (state.scoreA >= state.scoreB ? 'A' : 'B')
            : (state.scoreA >= s.max ? 'A' : 'B');
          segmentWinners[idx] = {
            team: reachedTeam,
            name: reachedTeam === 'A' ? nameA : nameB,
            scoreA: state.scoreA,
            scoreB: state.scoreB
          };
        }
      });

      const nextSeg = getMilestoneSeg(state.scoreA, state.scoreB);
      if (nextSeg !== activeSegmentIndex) {
        saveSegRoster(activeSegmentIndex);
        applySegRoster(nextSeg, true, `Milestone ${RELAY_SEGMENTS[nextSeg].min} Pts Reached`);
      }

      if (!state.gameOver && (state.scoreA >= state.gameTarget || state.scoreB >= state.gameTarget)) {
        state.gameOver = true;
        const winnerName = state.scoreA >= state.scoreB ? nameA : nameB;
        faultHistory.push(`🏆 Game Over: ${winnerName} won (${state.scoreA}-${state.scoreB})`);
      }
    }

    function awardPoint(winner) {
      if (state.gameOver) return;
      pushHistorySnapshot();
      const wasServing = winner === state.servingTeam;
      if (winner === 'A') state.scoreA++; else state.scoreB++;
      state.isOpeningServe = false;
      if (wasServing) {
        const tmp = state.positions[`${winner}_left`];
        state.positions[`${winner}_left`] = state.positions[`${winner}_right`];
        state.positions[`${winner}_right`] = tmp;
        saveSegRoster(activeSegmentIndex);
      } else {
        state.servingTeam = winner;
        state.serverNumber = 1;
      }
      refreshServerState(winner);
      checkMilestoneAndGameOver();
      render();
    }

    function handleServerFaultOrLoss() {
      if (state.gameOver) return;
      pushHistorySnapshot();
      if (state.isOpeningServe) { state.isOpeningServe = false; state.servingTeam = state.servingTeam === 'A' ? 'B' : 'A'; state.serverNumber = 1; }
      else if (state.serverNumber === 1) { state.serverNumber = 2; }
      else { state.servingTeam = state.servingTeam === 'A' ? 'B' : 'A'; state.serverNumber = 1; }
      refreshServerState(state.servingTeam);
      checkMilestoneAndGameOver();
      render();
    }

    function applyHandicapPoint(team) {
      if (state.gameOver) return;
      pushHistorySnapshot();
      if (team === 'A') state.scoreA++; else state.scoreB++;
      refreshServerState(team);
      checkMilestoneAndGameOver();
      render();
    }

    function handleSideFault(side) {
      if (state.gameOver) return;
      const faultTeam = resolveSideTeam(side);
      const { nameA, nameB } = getTeamNames();
      const pLabel = faultTeam === state.servingTeam ? `${state.servingPlayer} (${ord(state.serverNumber)})` : 'RECEIVER';
      faultHistory.push(`${faultTeam === 'A' ? nameA : nameB} (${pLabel}) - Foot Fault at ${state.scoreA}-${state.scoreB}`);
      if (faultTeam === state.servingTeam) handleServerFaultOrLoss();
      else awardPoint(faultTeam === 'A' ? 'B' : 'A');
    }

    function resetGame() {
      history = [];
      faultHistory = [];
      segmentWinners = [null, null, null, null, null];
      hideCourtSwitchPopup();
      Object.assign(state, { scoreA: 0, scoreB: 0, gameTarget: 100, gameOver: false, servingTeam: 'A', serverNumber: 1, isOpeningServe: true, servingSide: 'even', manualSwap: false });
      applySegRoster(0, false);
      render();
    }

    function undo() {
      if (!history.length) return;
      hideCourtSwitchPopup();
      const prev = history.pop();
      state = prev.state;
      segmentRosters = prev.rosters;
      segmentWinners = prev.winners || [null, null, null, null, null];
      activeSegmentIndex = prev.seg;
      document.getElementById('select-active-match').value = String(activeSegmentIndex);
      render();
    }

    function getDisplayShareUrl() {
      const base = PUBLIC_APP_URL || window.location.href.split('?')[0];
      const sep = base.includes('?') ? '&' : '?';
      return `${base}${sep}view=display&room=${encodeURIComponent(roomId)}`;
    }

    function renderRoomQRCode() {
      const box = document.getElementById('qr-code-box');
      const label = document.getElementById('qr-url-label');
      box.innerHTML = '';
      const url = getDisplayShareUrl();
      label.textContent = `Room ${roomId} — ${url}`;
      if (typeof QRCode !== 'undefined') {
        try { new QRCode(box, { text: url, width: 160, height: 160 }); return; } catch (_) {}
      }
      const img = document.createElement('img');
      img.width = 160; img.height = 160; img.alt = `QR ${roomId}`;
      img.src = `https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=${encodeURIComponent(url)}`;
      box.appendChild(img);
    }

    function setSyncIndicator(live, text) {
      document.getElementById('sync-dot').classList.toggle('live', Boolean(live));
      document.getElementById('sync-status-label').textContent = text;
    }

    function buildSnapshot() {
      const { nameA, nameB } = getTeamNames();
      return {
        type: 'score_update',
        roomId,
        state: clone(state),
        rosters: clone(segmentRosters),
        winners: clone(segmentWinners),
        activeSegmentIndex,
        faultHistory,
        teamNameA: nameA,
        teamNameB: nameB
      };
    }

    function applyRemoteSnapshot(payload) {
      if (!payload || String(payload.roomId || '').toUpperCase() !== roomId) return;
      isApplyingRemoteState = true;
      try {
        if (payload.state) state = payload.state;
        if (Array.isArray(payload.rosters)) segmentRosters = payload.rosters;
        if (Array.isArray(payload.winners)) segmentWinners = payload.winners;
        if (typeof payload.activeSegmentIndex === 'number') activeSegmentIndex = payload.activeSegmentIndex;
        if (Array.isArray(payload.faultHistory)) faultHistory = payload.faultHistory;
        if (typeof payload.teamNameA === 'string') document.getElementById('team-name-A').value = payload.teamNameA;
        if (typeof payload.teamNameB === 'string') document.getElementById('team-name-B').value = payload.teamNameB;
        document.getElementById('select-active-match').value = String(activeSegmentIndex);
        render();
      } finally { isApplyingRemoteState = false; }
    }

    function broadcastSnapshot() {
      if (viewMode !== 'control' || isApplyingRemoteState) return;
      const snap = buildSnapshot();
      localChannel?.postMessage(snap);
      realtimeChannel?.send({ type: 'broadcast', event: 'score_update', payload: snap });
    }

    function requestLatestState() {
      if (viewMode !== 'display') return;
      const req = { type: 'request_state', roomId };
      localChannel?.postMessage(req);
      realtimeChannel?.send({ type: 'broadcast', event: 'request_state', payload: req });
    }

    function applyViewMode(mode) {
      viewMode = mode === 'display' ? 'display' : 'control';
      const isDisp = viewMode === 'display';
      document.body.classList.toggle('display-mode', isDisp);
      document.getElementById('room-code-text').textContent = roomId;
      document.getElementById('select-active-match').disabled = isDisp;
      document.getElementById('select-game-rules').disabled = isDisp;
      document.getElementById('team-name-A').readOnly = isDisp;
      document.getElementById('team-name-B').readOnly = isDisp;
      document.querySelectorAll('.player-input').forEach((el) => { el.readOnly = isDisp; });
      if (isDisp) requestLatestState();
    }

    function initRealtimeSync() {
      if (localChannel) {
        localChannel.onmessage = (e) => {
          const d = e.data;
          if (!d || String(d.roomId || '').toUpperCase() !== roomId) return;
          if (d.type === 'request_state' && viewMode === 'control') broadcastSnapshot();
          else if (viewMode === 'display' && (!d.type || d.type === 'score_update')) applyRemoteSnapshot(d);
        };
      }
      if (typeof window.supabase === 'undefined' || !SUPABASE_CONFIG.url || !SUPABASE_CONFIG.anonKey) {
        setSyncIndicator(false, 'Local Tab Sync');
        return;
      }
      const client = window.supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.anonKey);
      realtimeChannel = client.channel(`pickleball-relay-${roomId}`, { config: { broadcast: { self: false, ack: true } } });
      realtimeChannel
        .on('broadcast', { event: 'score_update' }, ({ payload }) => { if (viewMode === 'display') applyRemoteSnapshot(payload); })
        .on('broadcast', { event: 'request_state' }, ({ payload }) => { if (viewMode === 'control' && payload && String(payload.roomId || '').toUpperCase() === roomId) broadcastSnapshot(); })
        .subscribe((status) => {
          if (status === 'SUBSCRIBED') {
            setSyncIndicator(true, 'Live Cloud');
            if (viewMode === 'control') broadcastSnapshot();
            else { requestLatestState(); setTimeout(requestLatestState, 400); }
          } else setSyncIndicator(false, status);
        });
    }

    document.getElementById('room-code-text').textContent = roomId;
    document.getElementById('btn-dismiss-court-switch').addEventListener('click', hideCourtSwitchPopup);
    document.getElementById('court-switch-modal').addEventListener('click', (e) => {
      if (e.target.id === 'court-switch-modal') hideCourtSwitchPopup();
    });
    document.getElementById('btn-toggle-qr').addEventListener('click', () => {
      const pop = document.getElementById('qr-popover');
      const open = pop.style.display === 'none';
      pop.style.display = open ? 'block' : 'none';
      if (open) renderRoomQRCode();
    });
    document.getElementById('btn-win-A').addEventListener('click', () => awardPoint(resolveSideTeam('left')));
    document.getElementById('btn-win-B').addEventListener('click', () => awardPoint(resolveSideTeam('right')));
    document.getElementById('btn-swap-court-ccw2').addEventListener('click', swapCourtPlayersCCW2);
    document.getElementById('btn-undo').addEventListener('click', undo);
    document.getElementById('btn-reset').addEventListener('click', resetGame);
    document.getElementById('btn-fault-A').addEventListener('click', () => handleSideFault('left'));
    document.getElementById('btn-fault-B').addEventListener('click', () => handleSideFault('right'));
    document.getElementById('btn-handicap-left').addEventListener('click', () => applyHandicapPoint(resolveSideTeam('left')));
    document.getElementById('btn-handicap-right').addEventListener('click', () => applyHandicapPoint(resolveSideTeam('right')));
    document.getElementById('btn-fault-serve').addEventListener('click', () => {
      if (state.gameOver) return;
      const { nameA, nameB } = getTeamNames();
      faultHistory.push(`${state.servingTeam === 'A' ? nameA : nameB} (${state.servingPlayer} (${ord(state.serverNumber)})) - Serve Fault at ${state.scoreA}-${state.scoreB}`);
      handleServerFaultOrLoss();
    });
    document.getElementById('select-game-rules').addEventListener('change', (e) => { state.gameTarget = parseInt(e.target.value, 10) || 100; checkMilestoneAndGameOver(); render(); });
    document.getElementById('select-active-match').addEventListener('change', (e) => {
      saveSegRoster(activeSegmentIndex);
      history = []; faultHistory = []; state.gameOver = false;
      applySegRoster(parseInt(e.target.value, 10), true, 'Segment Changed');
      render();
    });
    document.getElementById('team-name-A').addEventListener('input', render);
    document.getElementById('team-name-B').addEventListener('input', render);
    ['A', 'B'].forEach((t) => document.getElementById(`toggle-serve-${t}`).addEventListener('click', () => {
      state.servingTeam = t; state.serverNumber = 1; state.isOpeningServe = true; refreshServerState(t); render();
    }));
    document.querySelectorAll('.player-input').forEach((inp) => {
      inp.addEventListener('focus', (e) => setTimeout(() => e.target.setSelectionRange(0, e.target.value.length), 10));
      inp.addEventListener('click', (e) => e.stopPropagation());
      inp.addEventListener('input', (e) => { e.target.value = e.target.value.toUpperCase().slice(0, 3); updateCourtNamesFromInputs(); render(); });
    });
    document.querySelectorAll('.player-node').forEach((node) => {
      node.addEventListener('click', () => {
        if (viewMode === 'display') return;
        const t = node.id.includes('-A-') ? 'A' : (node.id.includes('-B-') ? 'B' : null);
        if (!t) return;
        state.servingTeam = t; state.serverNumber = 1; state.isOpeningServe = true; refreshServerState(t); render();
      });
    });

    applyViewMode(viewMode);
    initRealtimeSync();
    applySegRoster(0, false);
    render();
  </script>
</body>
</html>
